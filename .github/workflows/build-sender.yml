# Build the native Windows sender.
#
# Why build in CI: sender depends on CGO (libopus + malgo), and cross-compiling
# from a Mac means setting up a mingw toolchain and building a Windows libopus
# from source; MSYS2 has a ready-made mingw-w64 opus package that installs in
# one step on a Windows runner.
name: build-sender

on:
  push:
    paths:
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - ".github/workflows/build-sender.yml"
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-opus
            mingw-w64-x86_64-go

      - name: Build
        env:
          CGO_ENABLED: "1"
        run: |
          export GOROOT=/mingw64/lib/go
          export PATH=/mingw64/bin:$PATH
          # Link opus statically so the user gets a single exe with no DLL to ship.
          # nolibopusfile: only the codec is used, do not link opusfile (that is for reading .opus files)
          go build -tags nolibopusfile -ldflags "-extldflags -static" -o remotevisio-sender.exe ./cmd/sender
          # GUI version: -H windowsgui suppresses the black console window. The
          # .syso carries the exe icon (Explorer, taskbar); Go links it in by name.
          go run github.com/akavel/rsrc@v0.10.2 -ico icons/RemoteVisio.ico -o cmd/sender-gui/rsrc_windows_amd64.syso
          go build -tags nolibopusfile -ldflags "-H windowsgui -extldflags -static" -o RemoteVisio.exe ./cmd/sender-gui

      - uses: actions/upload-artifact@v4
        with:
          name: remotevisio-sender-windows
          path: |
            remotevisio-sender.exe
            RemoteVisio.exe

  # Receiver macOS binary: opus linked statically, so the artifact is a single
  # dependency-free file. When deploying to several Mac minis the target only
  # needs the Remote Visio browser extension in its Chromium browser (and, for
  # native apps' camera, the camera system extension the app installs), not
  # Go or brew opus.
  mac-receiver:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build
        run: |
          brew list opus >/dev/null 2>&1 || brew install opus
          # Hand the .a straight to the linker + strip unreferenced dylibs = opus is forced static
          CGO_ENABLED=1 \
          CGO_LDFLAGS="$(brew --prefix opus)/lib/libopus.a -Wl,-dead_strip_dylibs" \
          go build -tags nolibopusfile -o remotevisio-receiver ./cmd/receiver
          # Guard: the artifact must not depend on any brew library, or it will not start on other machines
          if otool -L remotevisio-receiver | grep -q /opt/homebrew; then
            echo "static link failed; the binary still depends on Homebrew libraries:"; otool -L remotevisio-receiver; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: remotevisio-receiver-macos
          path: remotevisio-receiver
