<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/favicon-96.png" sizes="96x96" type="image/png">
<link rel="apple-touch-icon" href="/favicon-96.png">
<title>Remote Visio</title>
<style>
  :root {
    --bg: #0f1115;
    --fg: #e8eaed;
    --dim: #8a8f98;
    --line: #262a33;
    --line2: #3c4043;
    --tile: #202124;
    --ok: #35c46b;
    --warn: #e0a034;
    --err: #e05a4f;
    --off: #5f6368;
    --red: #ea4335;
    --blue: #8ab4f8;
    --join: #1a73e8;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif;
    padding: 24px 16px;
  }
  main { width: 100%; max-width: 640px; min-width: 0; }
  h1 { font-size: 17px; font-weight: 600; margin: 0 0 2px; }
  h2 { font-size: 13px; font-weight: 600; color: var(--dim); margin: 0 0 8px; }
  .target { color: var(--dim); font-size: 13px; margin-bottom: 16px; overflow-wrap: anywhere; }
  button { font: inherit; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  .sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
  svg.ic { width: 20px; height: 20px; flex: none; fill: currentColor; }

  /* The tile: this device's camera as the Mac will get it (mirrored, as a mirror is what people expect to see of
     themselves), or a placeholder saying why there is none. The quick toggles sit over its bottom edge, like Meet's. */
  .tile {
    position: relative;
    aspect-ratio: 16 / 9;
    background: var(--tile);
    border-radius: 12px;
    overflow: hidden;
  }
  .tile video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
    background: #000;
  }
  .camoff {
    position: absolute;
    inset: 0 16px 72px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: var(--dim);
    font-size: 14px;
    text-align: center;
  }
  .camoff svg { width: 40px; height: 40px; fill: currentColor; opacity: .8; }
  .tilebar {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 14px;
    display: flex;
    justify-content: center;
    gap: 16px;
  }
  .round {
    width: 48px;
    height: 48px;
    padding: 0;
    display: grid;
    place-items: center;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, .55);
    background: rgba(32, 33, 36, .62);
    color: #fff;
    --lvl: 0;
    box-shadow: 0 0 0 calc(var(--lvl) * 6px) rgba(138, 180, 248, .55);
    transition: background-color .15s, box-shadow .08s linear;
  }
  .round svg { width: 24px; height: 24px; fill: currentColor; }
  .round:hover { background: rgba(60, 64, 67, .8); }
  .round.off { background: var(--red); border-color: var(--red); box-shadow: none; }
  .round.off:hover { background: #d93025; }
  /* A device that is wanted but does not work (its status is red: no permission, no camera...): the slashed icon on
     Meet's grey, and a red warning badge, so it never reads as "on" while nothing is sent. Not red: red means "off". */
  .round { position: relative; }
  .round.problem { background: #3c4043; border-color: var(--err); }
  .round.problem::after {
    content: "!";
    position: absolute;
    top: -3px;
    right: -3px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--err);
    color: #fff;
    font: 700 12px/18px -apple-system, "Segoe UI", system-ui, sans-serif;
    text-align: center;
  }
  .round:focus-visible, .join:focus-visible, .profiles button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  /* A rule of its own: a browser without :has() drops the whole rule it is in. */
  .pill:has(select:focus-visible) { outline: 2px solid var(--blue); outline-offset: 2px; }
  /* For screen readers only: the status changes are announced from here. */
  .sr { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  /* Meet's speaking indicator: three bars in a blue disc, at the tile's top left, while the microphone is on. */
  .bars {
    position: absolute;
    top: 12px;
    left: 12px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--join);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2px;
    --lvl: 0;
  }
  .bars i {
    width: 4px;
    height: 12px;
    border-radius: 2px;
    background: #fff;
    transform: scaleY(calc(.33 + var(--lvl) * .67));
    transition: transform .08s linear;
  }
  .bars i:nth-child(2) { transform: scaleY(calc(.33 + var(--lvl) * 1.3)); max-height: 14px; }
  .bars svg { display: none; width: 16px; height: 16px; fill: #fff; }
  /* Muted: Meet's crossed-out microphone in a grey disc instead of the bars; grey shows on the empty tile as on video. */
  .bars.muted { background: rgba(95, 99, 104, .9); }
  .bars.muted i { display: none; }
  .bars.muted svg { display: block; }

  /* Device pills: a native select dressed as Meet's pill, so it stays accessible and opens the phone's own list. */
  .pills { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 16px; }
  .pill {
    position: relative;
    flex: 1 1 180px;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 6px;
    height: 36px;
    padding: 0 10px 0 12px;
    border: 1px solid var(--line2);
    border-radius: 18px;
    color: var(--fg);
  }
  .pill:focus-within { border-color: var(--blue); }
  .pill .ic { width: 18px; height: 18px; color: var(--dim); }
  .pill select {
    flex: 1;
    min-width: 0;
    height: 100%;
    padding: 0 20px 0 0;
    font: inherit;
    font-size: 14px;
    color: inherit;
    background: transparent;
    border: 0;
    outline: none;
    appearance: none;
    -webkit-appearance: none;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
  }
  .pill select option { background: var(--tile); color: var(--fg); }
  .pill .chev { position: absolute; right: 10px; width: 18px; height: 18px; fill: var(--dim); pointer-events: none; }
  /* A pill that only says what it is for (no permission yet, or no such device) has nothing to choose: no chevron. */
  .pill:has(select[data-placeholder="1"]) .chev { display: none; }
  .pill select[data-placeholder="1"] { cursor: default; }
  @media (pointer: coarse) { .pill select { font-size: 16px; } } /* below 16 px, iOS zooms the page on focus */

  .join {
    display: block;
    width: 100%;
    padding: 13px 16px;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    background: var(--join);
    border: 0;
    border-radius: 24px;
  }
  .join:hover { background: #1765cc; }
  .join.live { background: var(--red); }
  .join.live:hover { background: #d93025; }

  /* Device panel: per device its state, and for the microphone and the speaker the level and the volume. */
  .devices { margin-top: 16px; border-top: 1px solid var(--line); }
  .dev { padding: 12px 0; border-bottom: 1px solid var(--line); min-width: 0; }
  .devhead { display: flex; align-items: flex-start; gap: 8px; font-size: 14px; }
  .devhead .ic { color: var(--dim); margin-top: 1px; }
  .devname { font-weight: 600; white-space: nowrap; }
  .status {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    align-items: baseline;
    gap: 6px;
    justify-content: flex-end;
    text-align: right;
    color: var(--dim);
    font-size: 13px;
    overflow-wrap: anywhere;
  }
  .status .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--off); transform: translateY(-1px); }
  .status[data-state=ok] .dot { background: var(--ok); }
  .status[data-state=wait] .dot { background: var(--warn); }
  .status[data-state=bad] .dot { background: var(--err); }
  .status[data-state=ok] .st-text { color: var(--fg); }
  .status[data-state=bad] .st-text { color: var(--err); }
  /* On a phone the status takes its own line under the device's name, where a long one reads better. */
  @media (max-width: 520px) {
    .devhead { flex-wrap: wrap; row-gap: 2px; }
    .status { flex-basis: 100%; justify-content: flex-start; text-align: left; margin-left: 28px; }
  }
  .st-detail { margin: 4px 0 0 28px; font-size: 12px; color: var(--dim); overflow-wrap: anywhere; }
  .levelrow { display: flex; align-items: center; gap: 12px; margin: 10px 0 0 28px; }
  .lvl {
    flex: 1 1 auto;
    min-width: 60px;
    height: 6px;
    background: var(--line);
    border-radius: 3px;
    overflow: hidden;
    --lvl: 0;
  }
  .lvl i {
    display: block;
    height: 100%;
    background: var(--ok);
    transform-origin: left;
    transform: scaleX(var(--lvl));
    transition: transform .08s linear;
  }
  .lvl.muted i { background: var(--off); }
  .vol { display: flex; align-items: center; gap: 6px; flex: 0 1 46%; min-width: 0; color: var(--dim); }
  .vol svg { width: 16px; height: 16px; fill: currentColor; flex: none; }
  .vol input { flex: 1; min-width: 0; margin: 0; accent-color: var(--blue); }
  .vol output { flex: none; width: 3.6em; text-align: right; font-size: 12px; font-variant-numeric: tabular-nums; }

  .profiles {
    display: inline-flex;
    max-width: calc(100% - 28px);
    margin: 10px 0 0 28px;
    border: 1px solid var(--line2);
    border-radius: 16px;
    overflow: hidden;
  }
  .profiles button {
    min-width: 0;
    padding: 4px 12px;
    font-size: 12px;
    color: var(--dim);
    background: none;
    border: 0;
    border-left: 1px solid var(--line2);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .profiles button:first-child { border-left: 0; }
  .profiles button.on { color: var(--bg); background: var(--blue); font-weight: 600; }

  .connsec { margin-top: 16px; }
  .conns {
    font-size: 13px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  /* A connection: the receiver and the round trip on one line, its state (and the camera's picture) on the next, so a
     long receiver name or a long state never squeezes the other into a narrow column. */
  .connhead { display: flex; align-items: baseline; gap: 10px; }
  .conn .host { flex: 1 1 auto; min-width: 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .conn .rtt { flex: none; color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .conn .connst { overflow-wrap: anywhere; }
  .conn .vid { color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .conn .vid.note { white-space: normal; }
  .empty { color: var(--dim); }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .err { color: var(--err); }
  .src {
    margin-top: 28px;
    text-align: center;
    font-size: 12px;
    opacity: .45;
  }
  .src a { color: inherit; }

  /* Levels without the motion: no easing, no speaking disc (the meters still say whether there is sound); the muted
     badge, which does not move, stays. */
  @media (prefers-reduced-motion: reduce) {
    .round, .lvl i, .bars i { transition: none; }
    .bars:not(.muted) { display: none; }
  }

  /* Relay mode only (the page as the website serves it): the line under Start that says why it cannot start, a
     connection's buttons (Take over, Forget it), the pairing card and the list of paired computers. */
  .starthint { margin: 8px 0 0; font-size: 13px; color: var(--warn); text-align: center; overflow-wrap: anywhere; }
  .connact { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .btn {
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 600;
    color: var(--fg);
    background: none;
    border: 1px solid var(--line2);
    border-radius: 16px;
  }
  .btn:hover { background: rgba(255, 255, 255, .06); }
  .btn.primary { color: #fff; background: var(--join); border-color: var(--join); }
  .btn.primary:hover { background: #1765cc; }
  .btn.danger { color: #fff; background: var(--red); border-color: var(--red); }
  .btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .pairing {
    margin: 0 0 16px;
    padding: 14px 16px;
    background: var(--tile);
    border: 1px solid var(--line2);
    border-radius: 12px;
    overflow-wrap: anywhere;
  }
  .pairing[data-state=confirm-cross] { border-color: var(--warn); }
  .pairing[data-state=result][data-result]:not([data-result=done]):not([data-result=kept]) { border-color: var(--err); }
  .pairing h2 { color: var(--fg); font-size: 15px; margin: 0 0 8px; }
  .pairing p { margin: 0 0 12px; }
  .pairing .dim { color: var(--dim); font-size: 13px; }
  .pairing .warn { color: var(--warn); }
  .pairing .number { margin: 4px 0 12px; font-size: 40px; font-weight: 700; letter-spacing: .06em; text-align: center; font-variant-numeric: tabular-nums; }
  .pairing .btnrow { display: flex; flex-wrap: wrap; gap: 8px; }
  .computers { margin-top: 16px; }
  .complist { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
  .comp { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; min-width: 0; }
  .comp input[type=radio] { flex: none; margin: 0; accent-color: var(--blue); width: 18px; height: 18px; }
  .comp label { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; cursor: pointer; overflow-wrap: anywhere; }
  .comp .compname { font-weight: 600; }
  .comp .compmeta { color: var(--dim); font-size: 12px; }
  .comp .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--off); }
  .comp .dot[data-online=true] { background: var(--ok); }
  .comp .btnrow { flex: none; display: flex; gap: 6px; }
  .comp .ask { flex-basis: 100%; }
  .devname-row { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 13px; color: var(--dim); }
  .devname-row input {
    flex: 1 1 auto;
    min-width: 0;
    padding: 6px 10px;
    font: inherit;
    font-size: 14px;
    color: var(--fg);
    background: transparent;
    border: 1px solid var(--line2);
    border-radius: 8px;
  }
  .devname-row input:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
  .pairhow { margin: 10px 0 0; font-size: 13px; color: var(--dim); }
  @media (pointer: coarse) { .devname-row input { font-size: 16px; } } /* below 16 px, iOS zooms the page on focus */

  /* Debug log (?debug=1, or the link at the bottom): wider, so a candidate pair fits on a line. */
  main.debugging { max-width: 720px; }
  .debug { margin-top: 20px; border-top: 1px solid var(--line); padding-top: 12px; }
  .debughead { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--dim); margin-bottom: 8px; }
  .debughead span { flex: 1; }
  .debughead button {
    width: auto;
    padding: 4px 12px;
    font-size: 12px;
    font-weight: 500;
    color: var(--fg);
    background: none;
    border: 1px solid var(--line);
    border-radius: 6px;
  }
  .debuglog {
    margin: 0;
    max-height: 50vh;
    overflow: auto;
    padding: 8px;
    font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--dim);
    white-space: pre-wrap;
    word-break: break-all;
    background: #0a0c0f;
    border: 1px solid var(--line);
    border-radius: 8px;
  }
</style>
</head>
<body>
<!-- Icons (Material's), drawn once and used by reference. -->
<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-mic" viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></symbol>
  <symbol id="i-mic-off" viewBox="0 0 24 24"><path d="M19 11h-1.7c0 .74-.16 1.43-.43 2.05l1.23 1.23c.56-.98.9-2.09.9-3.28zm-4.02.17c0-.06.02-.11.02-.17V5c0-1.66-1.34-3-3-3S9 3.34 9 5v.18l5.98 5.99zM4.27 3L3 4.27l6.01 6.01V11c0 1.66 1.33 3 2.99 3 .22 0 .44-.03.65-.08l1.66 1.66c-.71.33-1.5.52-2.31.52-2.76 0-5.3-2.1-5.3-5.1H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c.91-.13 1.77-.45 2.54-.9L19.73 21 21 19.73 4.27 3z"/></symbol>
  <symbol id="i-cam" viewBox="0 0 24 24"><path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11l-4 4z"/></symbol>
  <symbol id="i-cam-off" viewBox="0 0 24 24"><path d="M21 6.5l-4 4V7c0-.55-.45-1-1-1H9.82L21 17.18V6.5zM3.27 2L2 3.27 4.73 6H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.21 0 .39-.08.54-.18L19.73 21 21 19.73 3.27 2z"/></symbol>
  <symbol id="i-spk" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></symbol>
  <symbol id="i-spk-off" viewBox="0 0 24 24"><path d="M16.5 12A4.5 4.5 0 0 0 14 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.8 8.8 0 0 0 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a9 9 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></symbol>
  <symbol id="i-vol-low" viewBox="0 0 24 24"><path d="M7 9v6h4l5 5V4l-5 5H7z"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></symbol>
</svg>
<main>
  <h1 data-i18n="title">Remote Visio</h1>
  <div class="target" id="target">—</div>

  <!-- Relay mode only (pair-ui.js fills it): a pairing link's confirmation, the number to type on the computer, the
       final choice, and how a pairing ended. -->
  <section id="pairing" class="pairing" hidden aria-live="polite"></section>

  <div class="tile" id="tile">
    <video id="campreview" muted playsinline autoplay hidden></video>
    <div class="camoff" id="camoff"><svg aria-hidden="true"><use href="#i-cam-off"/></svg><span id="camoff-text"></span></div>
    <div class="bars" id="mic-bars" aria-hidden="true" hidden><i></i><i></i><i></i><svg><use href="#i-mic-off"/></svg></div>
    <div class="tilebar">
      <button type="button" class="round" id="mic-toggle" aria-pressed="true" aria-describedby="mic-status mic-detail"><svg aria-hidden="true"><use href="#i-mic"/></svg></button>
      <button type="button" class="round" id="cam-toggle" aria-pressed="true" aria-describedby="cam-status cam-detail"><svg aria-hidden="true"><use href="#i-cam"/></svg></button>
      <button type="button" class="round" id="spk-toggle" aria-pressed="true" aria-describedby="spk-status spk-detail"><svg aria-hidden="true"><use href="#i-spk"/></svg></button>
    </div>
  </div>

  <div class="pills">
    <div class="pill" id="mic-pill"><svg class="ic" aria-hidden="true"><use href="#i-mic"/></svg><select id="micsel"></select><svg class="chev" aria-hidden="true"><use href="#i-chev"/></svg></div>
    <div class="pill" id="spk-pill"><svg class="ic" aria-hidden="true"><use href="#i-spk"/></svg><select id="spksel"></select><svg class="chev" aria-hidden="true"><use href="#i-chev"/></svg></div>
    <div class="pill" id="cam-pill"><svg class="ic" aria-hidden="true"><use href="#i-cam"/></svg><select id="camsel"></select><svg class="chev" aria-hidden="true"><use href="#i-chev"/></svg></div>
  </div>

  <button type="button" id="toggle" class="join" data-i18n="start">Start</button>
  <p class="starthint" id="starthint" hidden aria-live="polite"></p>

  <section class="devices">
    <div class="dev" id="dev-mic">
      <div class="devhead">
        <svg class="ic" aria-hidden="true"><use href="#i-mic"/></svg><span class="devname" data-i18n="mic">Microphone</span>
        <div class="status" id="mic-status" data-status="mic" data-state="off"><i class="dot"></i><span class="st-text"></span></div>
      </div>
      <div class="st-detail" id="mic-detail" hidden></div>
      <div class="levelrow">
        <div class="lvl" id="mic-level" data-level="0" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></div>
        <label class="vol"><svg aria-hidden="true"><use href="#i-mic"/></svg><input type="range" id="mic-gain" min="0" max="200" step="5"><output id="mic-gain-out" for="mic-gain" aria-hidden="true"></output></label>
      </div>

<script>
// How this page reaches the computers it sends to (its "transport", see Transports below). The Go receiver serves the
// page as it is: the receiver transport, which talks to the receiver that served it and to the others that one found.
// The website serves a copy with data-transport="relay" on <html> (site/scripts/build-sender.mjs): the relay transport
// (relay.js), which pairs with the Remote Visio extension on a computer and reaches it through the site's relay,
// encrypted end to end ("direct mode": bin/e2e-harness/DESIGN-direct-mode.md, section 8).
const TRANSPORT = document.documentElement.dataset.transport === 'relay' ? 'relay' : 'receiver';

// A pairing link carries its secret in the address's fragment (#p=1.<room>.<secret>). Relay mode takes it out of the
// address at once, before anything on this page can log it (the debug log starts with the address), keep it (the
// history, a bookmark, a restored tab) or pass it on. pair-ui.js takes it from here, once (takeFragment), and keeps it
// in memory only. A link opened in a tab that already shows the page changes only the fragment: same treatment.
let pendingFragment = '';
function takeHash() {
  if (TRANSPORT !== 'relay' || !location.hash) return false;
  pendingFragment = location.hash;
  history.replaceState(null, '', location.pathname + location.search);
  return true;
}
function takeFragment() {
  const f = pendingFragment;
  pendingFragment = '';
  return f;
}
takeHash();

let stream = null, statsTimer = null, statusTimer = null, rafId = null;
let live = false, discoverTimer = null;

// One independent connection per receiver: each negotiates and reconnects on its own, so one going down doesn't affect the rest.
// conns: target key -> { target, pc, retry, retryTimer, healTimer, state, cls, rtt, needCert, speaker, ... }, where
// target is what the transport listed ({key, ...}; the receiver's key is its origin).
const conns = new Map();

if (TRANSPORT === 'receiver') $('target').textContent = t('target', { host: location.host });

// Debug log. A connection stuck on "Connecting" says nothing about why, and a phone has no developer tools. So the
// page keeps a log of what it does -- permissions, discovery, and for each connection its ICE candidates (this
// device's and the receiver's), its states, and its candidate pairs with the checks sent and answered each way -- and
// shows it under the connections with ?debug=1, or the link at the bottom (?debug=0 hides it again; the choice is
// remembered). It is kept either way, so turning it on shows what already happened. It holds network addresses but
// never TURN credentials, and leaves this page only when the user copies it.
const DEBUG_MAX = 1500;
const debugLines = [];
let debugOn = (() => {
  const q = new URLSearchParams(location.search).get('debug');
  if (q === '1' || q === '0') localStorage.setItem('debug', q);
  return localStorage.getItem('debug') === '1';
})();

function dlog(...parts) {
  const d = new Date();
  const line = d.toTimeString().slice(0, 8) + '.' + String(d.getMilliseconds()).padStart(3, '0') + ' ' + parts.join(' ');
  debugLines.push(line);
  if (debugLines.length > DEBUG_MAX) debugLines.shift();
  console.debug('[remotevisio]', line);
  if (!debugOn) return;
  const pre = $('debuglog');
  const atEnd = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 4;
  pre.append(line + '\n');
  while (pre.childNodes.length > DEBUG_MAX) pre.firstChild.remove();
  if (atEnd) pre.scrollTop = pre.scrollHeight;
}

function renderDebug() {
  $('debug').hidden = !debugOn;
  document.querySelector('main').classList.toggle('debugging', debugOn);
  const pre = $('debuglog');
  if (!debugOn) { pre.replaceChildren(); return; }
  pre.replaceChildren(...debugLines.map(l => l + '\n'));
  pre.scrollTop = pre.scrollHeight;
}
renderDebug();

$('debuglink').onclick = e => {
  e.preventDefault();
  debugOn = !debugOn;
  localStorage.setItem('debug', debugOn ? '1' : '0');
  renderDebug();
};
$('debugclear').onclick = () => { debugLines.length = 0; $('debuglog').replaceChildren(); };
$('debugcopy').onclick = async () => {
  try {
    await navigator.clipboard.writeText(debugLines.join('\n') + '\n');
  } catch {
    // No clipboard access (an older browser): select the log, so it can be copied by hand.
    const r = document.createRange();
    r.selectNodeContents($('debuglog'));
    getSelection().removeAllRanges();
    getSelection().addRange(r);
    return;
  }
  $('debugcopy').textContent = t('debug_copied');
  setTimeout(() => { $('debugcopy').textContent = t('debug_copy'); }, 1500);
};

dlog('page', location.href);
dlog('browser', navigator.userAgent);
dlog('secure context', isSecureContext, '| WebRTC', typeof RTCPeerConnection === 'function', '| language', LANG);
addEventListener('error', e => dlog('page error:', e.message, e.filename ? `(${e.filename}:${e.lineno})` : ''));
addEventListener('unhandledrejection', e => dlog('unhandled rejection:', String((e.reason && e.reason.message) || e.reason)));

// describeCandidate turns an ICE candidate line ("candidate:... 1 udp 2122260223 192.168.1.5 54321 typ host ...")
// into "host udp 192.168.1.5:54321"; a server-reflexive or relay candidate also names the address it stands for.
function describeCandidate(line) {
  const f = String(line).replace(/^a=/, '').replace(/^candidate:/, '').trim().split(/\s+/);
  if (f.length < 8 || f[6] !== 'typ') return String(line);
  let s = `${f[7]} ${f[2].toLowerCase()} ${f[4]}:${f[5]}`;
  const ra = f.indexOf('raddr'), rp = f.indexOf('rport');
  if (ra > 0 && rp > 0) s += ` (for ${f[ra + 1]}:${f[rp + 1]})`;
  const tt = f.indexOf('tcptype');
  if (tt > 0) s += ` tcptype ${f[tt + 1]}`;
  if (f[1] !== '1') s += ` component ${f[1]}`;
  return s;
}

// describeTrack names a microphone or camera and the settings the browser gave it.
function describeTrack(track) {
  if (!track) return 'none';
  const s = track.getSettings ? track.getSettings() : {};
  const keep = ['width', 'height', 'frameRate', 'sampleRate', 'channelCount', 'echoCancellation', 'noiseSuppression', 'autoGainControl'];
  const parts = keep.filter(k => s[k] !== undefined).map(k => `${k}=${typeof s[k] === 'number' ? Math.round(s[k] * 100) / 100 : s[k]}`);
  return (track.label || '(no name)') + (parts.length ? ' ' + parts.join(' ') : '');
}

// describeICE lists the STUN/TURN servers' URLs; never their credentials.
function describeICE(servers) {
  const urls = (servers || []).flatMap(s => [].concat(s.urls || s.url || []));
  return urls.length ? urls.join(', ') : 'none';
}

// debugPairs logs a connection's candidate pairs. While it is not connected: all of them, every few seconds (or at
// once with force), each with the checks sent and answered in both directions -- that tells "nothing gets through"
// from "only one way does". Once connected: the pair in use, when it changes.
function debugPairs(c, pc, stats, force) {
  const h = transport.tag(c);
  const state = pc.iceConnectionState;
  const pairs = [];
  let chosen = null;
  stats.forEach(r => {
    if (r.type === 'candidate-pair') pairs.push(r);
    if (r.type === 'transport' && r.selectedCandidatePairId) chosen = r.selectedCandidatePairId;
  });
  const side = id => {
    const x = stats.get(id);
    return x ? `${x.candidateType} ${x.protocol} ${x.address ?? x.ip}:${x.port}` : '?';
  };
  const describe = p => `${side(p.localCandidateId)} -> ${side(p.remoteCandidateId)}: ${p.state}${p.nominated ? ', nominated' : ''}` +
    `, checks sent ${p.requestsSent ?? 0} answered ${p.responsesReceived ?? 0}` +
    `, checks received ${p.requestsReceived ?? 0} answered ${p.responsesSent ?? 0}`;
  if (state === 'connected' || state === 'completed') {
    const p = (chosen && stats.get(chosen)) || pairs.find(x => x.state === 'succeeded' && x.nominated);
    const key = p ? p.localCandidateId + '|' + p.remoteCandidateId : '';
    if (p && key !== c.debugChosen) {
      c.debugChosen = key;
      dlog(h, 'in use:', describe(p) + (p.currentRoundTripTime != null ? `, RTT ${Math.round(p.currentRoundTripTime * 1000)} ms` : ''));
    }
    return;
  }
  c.debugChosen = '';
  const now = Date.now();
  if (!force && now - (c.debugPairsAt || 0) < 5000) return;
  c.debugPairsAt = now;
  if (!pairs.length) { dlog(h, `ICE ${state}: no candidate pairs${state === 'new' || state === 'checking' ? ' yet' : ''}`); return; }
  dlog(h, `ICE ${state}: ${pairs.length} candidate pair${pairs.length === 1 ? '' : 's'}`);
  for (const p of pairs) dlog(h, '  ' + describe(p));
}

$('toggle').onclick = () => (live ? stop() : start());

// ---- What the user wants: the three devices on or off, and the two volumes ----

// Each switch is remembered ('1' on, '0' off) and works before Start too: it then only sets what Start will do. All
// three are on by default, the camera included, as in a meeting's waiting room.
function readFlag(key, def) {
  const v = localStorage.getItem(key);
  return v === null ? def : v === '1';
}

// The page used to have two checkboxes, "Send this device's camera" ('cam', off by default) and "Hear the remote Mac"
// ('hear', on by default). A choice made there carries over to the camera and speaker switches, once: the old keys
// are removed as soon as they are read.
(() => {
  const cam = localStorage.getItem('cam'), hear = localStorage.getItem('hear');
  if (cam !== null) { localStorage.setItem('camOn', cam === '1' ? '1' : '0'); localStorage.removeItem('cam'); }
  if (hear !== null) { localStorage.setItem('spkOn', hear === '0' ? '0' : '1'); localStorage.removeItem('hear'); }
})();

let micOn = readFlag('micOn', true);
let spkOn = readFlag('spkOn', true);
let camOn = readFlag('camOn', true);

// readPercent reads a remembered volume, in percent, within its range.
function readPercent(key, max, def) {
  const v = parseInt(localStorage.getItem(key), 10);
  return Number.isFinite(v) ? Math.min(max, Math.max(0, v)) : def;
}
// Microphone volume: a gain of 0-200 % applied here, before sending. Speaker volume: the return path's playback, 0-100 %.
let micGain = readPercent('micGain', 200, 100);
let spkVol = readPercent('spkVol', 100, 100);

// ---- The microphone's sound graph ----

// What every connection sends is not the microphone's own track but the output of a small WebAudio graph:
//   microphone track -> MediaStreamSource -> GainNode (the volume) -> MediaStreamAudioDestinationNode -> sent track
// and the level meter reads after the gain, so it shows what the Mac gets. The sent track lives as long as the session:
// switching microphones (a pick, a profile, the echo cancellation following the speaker) only swaps the graph's
// source, and muting is that track's enabled flag (silence, as in a meeting) -- no connection is touched for either.
// The AudioContext is made on Start, inside the click, which is what lets it run. A browser without one (Safari before
// 14.1 has only webkitAudioContext; anything may throw) gets a session without the microphone, which says why: the
// camera and the speaker do not need it.
let audioCtx = null, micSource = null, micGainNode = null, micDest = null, micAnalyser = null, sendTrack = null;
const AudioContextClass = window.AudioContext || window.webkitAudioContext;

function ensureAudio() {
  if (audioCtx) return;
  if (!AudioContextClass) throw new Error('no AudioContext in this browser');
  const ctx = audioCtx = new AudioContextClass({ latencyHint: 'interactive' });
  // The browser may suspend the context on its own -- iOS does after a call, Siri or a while in the background, and
  // calls it "interrupted" -- which silences what every connection sends. Ask for it back at once; where that needs a
  // gesture, the next tap or key does it (wakeAudio), and meanwhile the microphone's status says so.
  ctx.onstatechange = () => {
    if (ctx !== audioCtx) return;
    dlog('sound processing:', ctx.state);
    if (live && (ctx.state === 'suspended' || ctx.state === 'interrupted')) ctx.resume().catch(() => { /* waits for a gesture */ });
    renderStatus();
  };
  micGainNode = audioCtx.createGain();
  micGainNode.gain.value = micGain / 100;
  micDest = audioCtx.createMediaStreamDestination();
  micDest.channelCount = 1; // a microphone is mono; a stereo track would only be mixed down again by the encoder
  micAnalyser = audioCtx.createAnalyser();
  micAnalyser.fftSize = 1024;
  micGainNode.connect(micDest);
  micGainNode.connect(micAnalyser);
  sendTrack = micDest.stream.getAudioTracks()[0];
  sendTrack.enabled = micOn;
  audioCtx.resume().catch(() => { /* started inside the click: it normally runs already */ });
}

function closeAudio() {
  if (sendTrack) sendTrack.stop();
  if (audioCtx) audioCtx.close().catch(() => { /* closing anyway */ });
  audioCtx = micSource = micGainNode = micDest = micAnalyser = sendTrack = null;
}

// audioRunning tells whether the sound graph runs: while it does not, nothing of the microphone leaves and the
// analysers hold their last reading, so the meters must not believe them.
function audioRunning() {
  return !!audioCtx && audioCtx.state === 'running';
}

// wakeAudio brings back, on a user's tap or key, what a browser holds until one: a suspended sound graph, and a
// return-path player whose play() it refused (autoplay rules, e.g. Safari with the microphone not allowed).
function wakeAudio() {
  if (!live) return;
  if (audioCtx && audioCtx.state !== 'running' && audioCtx.state !== 'closed') audioCtx.resume().catch(() => { /* still held */ });
  for (const c of conns.values()) {
    if (c.speaker && c.speaker.srcObject && c.speaker.paused) c.speaker.play().catch(() => { /* still held */ });
  }
}
addEventListener('pointerdown', wakeAudio, true);
addEventListener('keydown', wakeAudio, true);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') wakeAudio(); });

// ---- Quick toggles ----

// None of them renegotiates: every connection always carries the audio line both ways and a video line (see
// connectOne), so turning a device off or on only changes what a line carries.

// Microphone off: the sent track goes silent (enabled = false), and the meter greys out but keeps showing the input,
// so speaking while muted is visible. The microphone itself stays open, ready to be turned back on at once.
$('mic-toggle').onclick = () => setMic(!micOn);
function setMic(on) {
  micOn = on;
  localStorage.setItem('micOn', on ? '1' : '0');
  if (sendTrack) sendTrack.enabled = on;
  recvMicMiss = 0; // the receiver's "no microphone sound lately" was about the muted track
  dlog('microphone', on ? 'on' : 'off (muted)');
  renderToggles();
  renderStatus();
  // Turned on with no microphone open (it failed at Start, or ended): this click is the user asking for it again.
  if (on && live && !stream) reacquireMic();
}

// Speaker off: the return path's players are muted here; the Mac keeps sending. The microphone's echo cancellation
// follows the speaker (see getMic), so the microphone is opened again with the new setting -- a source swap in the graph.
$('spk-toggle').onclick = () => setSpeaker(!spkOn);
function setSpeaker(on) {
  spkOn = on;
  localStorage.setItem('spkOn', on ? '1' : '0');
  for (const c of conns.values()) if (c.speaker) c.speaker.muted = !on;
  dlog('speaker', on ? 'on' : 'off (muted here)');
  renderToggles();
  renderStatus();
  renderConns();
  if (live) followSpeaker();
}

// followSpeaker gives the microphone the echo cancellation the speaker now calls for. It waits its turn behind any
// acquisition under way -- Start's may still be at the permission prompt, opened with the speaker's previous setting --
// and then reopens the microphone only if the one open has the wrong setting: quick toggles that end where they began
// cost nothing, and with no microphone open (refused, failed) there is nothing to follow.
function followSpeaker() {
  return queueMic(async () => {
    if (!live || !stream) return;
    if (stream.getAudioTracks()[0]?.getSettings?.().echoCancellation === spkOn) return;
    await reacquireMicNow(micId);
  });
}

// Camera off: every connection's video line loses its track (replaceTrack(null)) and the camera is stopped, so its
// light goes off. On: the remembered camera is opened again and put back on every line.
$('cam-toggle').onclick = () => setCam(!camOn);
function setCam(on) {
  camOn = on;
  localStorage.setItem('camOn', on ? '1' : '0');
  dlog('camera', on ? 'on' : 'off');
  renderToggles();
  if (!live) { renderTile(); renderStatus(); return; }
  if (on) acquireCam(camId); else releaseCam();
  renderTile();
  renderStatus();
}

// renderToggles shows each switch's state: aria-pressed, Meet's red when off, the slashed icon, and a title saying
// what a click does. The accessible name stays the device's, so a screen reader says "Microphone, toggle, pressed",
// followed by the device's status (aria-describedby). A device that is on but does not work (its status is red) gets
// the slashed icon too, in the "problem" look: aria-pressed keeps what the user wants, so a click still turns it off,
// and a second one tries again.
const TOGGLES = [
  { id: 'mic-toggle', kind: 'mic', on: () => micOn, name: 'mic', icon: 'i-mic', off: 'i-mic-off', tOff: 'btn_mic_off', tOn: 'btn_mic_on' },
  { id: 'cam-toggle', kind: 'cam', on: () => camOn, name: 'camera', icon: 'i-cam', off: 'i-cam-off', tOff: 'btn_cam_off', tOn: 'btn_cam_on' },
  { id: 'spk-toggle', kind: 'spk', on: () => spkOn, name: 'speaker', icon: 'i-spk', off: 'i-spk-off', tOff: 'btn_spk_off', tOn: 'btn_spk_on' },
];
function renderToggles() {
  for (const x of TOGGLES) {
    const b = $(x.id), on = x.on(), problem = on && statusNow[x.kind]?.state === 'bad';
    b.setAttribute('aria-pressed', String(on));
    b.setAttribute('aria-label', t(x.name));
    b.title = t(on ? x.tOff : x.tOn);
    b.classList.toggle('off', !on);
    b.classList.toggle('problem', problem);
    b.querySelector('use').setAttribute('href', '#' + (on && !problem ? x.icon : x.off));
  }
  $('mic-level').classList.toggle('muted', !micOn);
  $('spk-level').classList.toggle('muted', !spkOn);
  $('mic-bars').classList.toggle('muted', !micOn);
}

// ---- Volumes ----

// The sliders act while they move; the choice is remembered, and logged, when they are let go.
$('mic-gain').value = micGain;
$('mic-gain').setAttribute('aria-label', t('mic_volume'));
$('mic-gain').oninput = () => {
  micGain = Number($('mic-gain').value);
  if (micGainNode) micGainNode.gain.setTargetAtTime(micGain / 100, audioCtx.currentTime, 0.015);
  renderVolumes();
  renderStatus(); // "the volume is at 0 %"
};
$('mic-gain').onchange = () => {
  localStorage.setItem('micGain', String(micGain));
  dlog('microphone volume:', micGain + ' %');
};
$('spk-vol').value = spkVol;
$('spk-vol').setAttribute('aria-label', t('spk_volume'));
$('spk-vol').oninput = () => {
  spkVol = Number($('spk-vol').value);
  for (const c of conns.values()) if (c.speaker) c.speaker.volume = spkVol / 100;
  renderVolumes();
  renderStatus();
};
$('spk-vol').onchange = () => {
  localStorage.setItem('spkVol', String(spkVol));
  dlog('speaker volume:', spkVol + ' %');
};

// The value shown next to each slider is for the eye (aria-hidden: it would echo every step); assistive technology
// reads the slider's own aria-valuetext instead.
function renderVolumes() {
  $('mic-gain-out').textContent = micGain + '%';
  $('spk-vol-out').textContent = spkVol + '%';
  $('mic-gain').setAttribute('aria-valuetext', micGain + ' %');
  $('spk-vol').setAttribute('aria-valuetext', spkVol + ' %');
}

// iOS ignores a page setting a media element's volume (it is the device's buttons' alone, and reads back 1): there a
// speaker slider would show 40 % while playing at 100 %, so it is left out, and the level meter stays.
const canSetVolume = (() => {
  try {
    const a = document.createElement('audio');
    a.volume = 0.5;
    return Math.abs(a.volume - 0.5) < 0.01;
  } catch { return false; }
})();
$('spk-vol-box').hidden = !canSetVolume;
$('mic-level').setAttribute('aria-label', t('mic_level'));
$('spk-level').setAttribute('aria-label', t('spk_level'));

// ---- Audio profiles ----

// Audio profiles: switch a whole group of settings at once instead of tuning one knob at a time.
// The three tiers cover three real problems seen while troubleshooting: bubbly noise-suppression artifacts, background hiss, bad gain.
const PROFILES = {
  denoise: { label: 'profile_denoise', ns: true,  agc: true  }, // noisy room, mic level fine
  clean:   { label: 'profile_clean',   ns: false, agc: true  }, // use when noise suppression sounds bubbly
  raw:     { label: 'profile_raw',     ns: false, agc: false }, // no processing: for a mic whose level is already right
};
let profile = localStorage.getItem('profile');
// Backwards compatibility with the old ?ns=0 usage
if (!PROFILES[profile]) profile = new URLSearchParams(location.search).get('ns') === '0' ? 'clean' : 'denoise';

$('profiles').setAttribute('aria-label', t('mic_processing'));
for (const [key, p] of Object.entries(PROFILES)) {
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = t(p.label);
  b.title = t(p.label);
  b.dataset.key = key;
  b.onclick = () => switchProfile(key);
  $('profiles').appendChild(b);
}
renderProfiles();

function renderProfiles() {
  for (const b of $('profiles').children) {
    b.classList.toggle('on', b.dataset.key === profile);
    b.setAttribute('aria-pressed', String(b.dataset.key === profile));
  }
}

// Switching while live: grab a new track with the new constraints and swap it into the graph,
// so the connections stay up with no renegotiation. When not live, just remember the choice for the next start.
async function switchProfile(key) {
  if (key === profile) return;
  profile = key;
  localStorage.setItem('profile', key);
  dlog('profile:', key);
  renderProfiles();
  if (!live) return;
  await reacquireMic();
}

// ---- Devices ----

// Device pickers. Each one remembers its choice by the browser's device id (micId, spkId, camId), and '' stands for
// "whatever the system uses", so that choice keeps following the system. A remembered device that is gone (unplugged,
// or the browser rotated its id) gives way to the default when it is next opened, and is forgotten.
// Chromium lists its own stand-ins for the system's devices next to the real ones; the pickers offer the system default
// as their first entry instead.
const BROWSER_DEFAULTS = new Set(['default', 'communications']);
// The Remote Visio devices themselves (the browser extension's microphone, speaker and camera, and the Mac's virtual
// camera) carry what this page sends: picking one here would loop it back. The pickers leave them out.
const OURS = /^Remote Visio /;
// A request with no device named asks for any microphone or camera, which the Remote Visio browser extension (when it is
// in this browser, with "Use Remote Visio by default" on) answers with its own devices, after a question about this page.
// Naming the browser's default device, as a mere preference, leaves the request to the browser: it picks the device it
// would pick anyway (the system default microphone; a camera, as no camera has that id), and other browsers ignore it.
const ANY_DEVICE = { ideal: 'default' };
// The names of the devices seen so far, by id, so a log line can still name one that has just been unplugged.
const deviceNames = new Map();

// deviceName names a device for the debug log.
function deviceName(id) {
  if (!id) return 'default';
  return deviceNames.has(id) ? `"${deviceNames.get(id)}"` : `id ${id.slice(0, 8)}...`;
}

// Microphone: the one picked, or the system's default. Its state for the status line: a problem that left no
// microphone open (micProblem), the permission prompt still waiting (micWaiting), or a note about a failed switch
// while the previous microphone carries on (micNote).
let micId = localStorage.getItem('micId') || '';
let micProblem = null, micWaiting = false, micNote = '';
$('micsel').onchange = () => switchMic($('micsel').value);
$('micsel').setAttribute('aria-label', t('mic'));

function rememberMic(id) {
  micId = id;
  if (id) localStorage.setItem('micId', id); else localStorage.removeItem('micId');
}

// Picking a microphone while live: open it and swap it in (reacquireMic); the connections stay up. When not live,
// just remember the choice for the next start.
async function switchMic(id) {
  if (id === micId) return;
  dlog('microphone picked:', deviceName(id));
  if (!live) { rememberMic(id); return; }
  $('micsel').disabled = true;
  try { await reacquireMic(id); } finally { $('micsel').disabled = false; }
}

// Microphone acquisitions are queued, never concurrent, like the camera's: a pick made while Start is still waiting for
// the first one must end with the microphone picked last, not race it.
let micQueue = Promise.resolve();
function queueMic(run) {
  return micQueue = micQueue.then(run, run);
}

// reacquireMic re-acquires the mic (the one in use, or `want`) with the current settings and swaps it into the graph.
// The pick is remembered once that mic is open; a failed switch keeps the one in use, and the picker returns to it.
function reacquireMic(want = micId) {
  return queueMic(() => reacquireMicNow(want));
}

// reacquireMicNow is reacquireMic's run, for a caller that already holds its turn in the queue.
async function reacquireMicNow(want) {
  if (!live || !audioCtx) return; // no sound graph: the microphone's status already says why
  try {
    let { next, id } = await openMic(want);
    // Chrome cannot open a microphone with echo cancellation while it is open without: it hands back the open one's
    // processing (seen when the speaker is turned back on). Then let go of the old one and open it again -- a
    // moment of silence, on a switch the user just made.
    if (stream && spkOn && next.getAudioTracks()[0].getSettings?.().echoCancellation === false) {
      dlog('microphone: echo cancellation not applied while the previous one is open: reopening');
      next.getTracks().forEach(t => t.stop());
      dropMic();
      ({ next, id } = await openMic(want));
    }
    if (!live) { next.getTracks().forEach(t => t.stop()); return; }
    rememberMic(id);
    useMic(next);
    dlog('microphone:', describeTrack(next.getAudioTracks()[0]));
  } catch (err) {
    dlog('microphone switch failed:', err.name || '', err.message || '');
    if (stream) micNote = explainMicError(err); else micProblem = micProblemOf(err);
  }
  renderStatus();
  listDevices(); // the picker follows the mic in use (the list may have changed)
}

// openMic opens the microphone `want` (a device id, or '' for the default). A remembered one that is gone gives way to
// the default. Resolves to the stream and the id of the choice it honoured.
async function openMic(want) {
  try {
    return { next: await getMic(want), id: want };
  } catch (err) {
    if (!want || (err.name !== 'OverconstrainedError' && err.name !== 'NotFoundError')) throw err;
    dlog('microphone', deviceName(want), `is not available (${err.name}): using the default`);
    return { next: await getMic(''), id: '' };
  }
}

// getMic acquires one microphone (the default for '') for the current profile.
// Gain control is the browser's own (autoGainControl, by profile), before the volume set here.
// Echo cancellation is on only while the speaker is: the remote audio plays from the local speakers, the mic would
// send it straight back, and the browser's AEC knows exactly what it played. With the speaker off nothing can loop
// back, so leaving it on only adds latency.
function getMic(id) {
  const p = PROFILES[profile];
  return withTimeout(
    navigator.mediaDevices.getUserMedia({
      audio: {
        deviceId: id ? { exact: id } : ANY_DEVICE,
        echoCancellation: spkOn,
        noiseSuppression: p.ns,
        autoGainControl: p.agc,
      },
    }),
    20000,
    'The microphone never responded');
}

// useMic makes `next` the microphone in use: the graph's source (so every connection sends it, untouched), and the
// meter's. The previous one, if any, is stopped.
function useMic(next) {
  const old = stream;
  stream = next;
  next.getAudioTracks()[0].onended = () => micEnded(next);
  if (micSource) micSource.disconnect();
  micSource = audioCtx.createMediaStreamSource(next);
  micSource.connect(micGainNode);
  micProblem = null;
  micNote = '';
  if (old) old.getTracks().forEach(t => t.stop());
}

// dropMic takes the microphone out of the graph and stops it; the connections keep sending the graph's (now silent) track.
function dropMic() {
  if (micSource) { micSource.disconnect(); micSource = null; }
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
}

// A microphone that ends on its own (unplugged, or taken by the system) would leave every connection sending silence.
// Open the chosen one again -- the default, if the chosen one is gone -- but only when the browser already allows the
// microphone: a permission prompt out of nowhere, or right after the user took the permission back, is not ours to
// raise. Otherwise the status line says what happened. (Stopping a track ourselves fires no "ended".)
async function micEnded(s) {
  if (stream !== s || !live) return;
  dlog('microphone ended:', describeTrack(s.getAudioTracks()[0]));
  let allowed = false;
  try {
    allowed = (await navigator.permissions.query({ name: 'microphone' })).state === 'granted';
  } catch { /* the browser cannot tell: better silent than a prompt */ }
  if (stream !== s || !live) return;
  if (!allowed) {
    dropMic();
    micProblem = { key: 'ended', text: t('st_stopped'), detail: t('mic_ended') };
    renderStatus();
    return;
  }
  await reacquireMic();
}

// Speaker: where the return path plays on this device. Browsers without setSinkId (Safari, Firefox, phones) get no
// picker and play it on the system's default output; the switch, the volume and the level are theirs all the same.
const canPickSpeaker = typeof HTMLMediaElement === 'function' && 'setSinkId' in HTMLMediaElement.prototype;
let spkId = localStorage.getItem('spkId') || '';
$('spksel').onchange = () => switchSpeaker($('spksel').value);
$('spksel').setAttribute('aria-label', t('speaker'));
$('spk-pill').hidden = !canPickSpeaker;

function rememberSpeaker(id) {
  spkId = id;
  if (id) localStorage.setItem('spkId', id); else localStorage.removeItem('spkId');
}

// routeSpeaker points a connection's new return-path player at the chosen output, before it gets any sound, so nothing
// plays on the wrong one first. Never rejects: a player that cannot follow the choice plays on the default.
async function routeSpeaker(c, el) {
  if (!canPickSpeaker || !spkId) return;
  const want = spkId;
  try {
    await el.setSinkId(want);
    dlog(transport.tag(c), 'return path plays on', deviceName(want));
  } catch (err) {
    dlog(transport.tag(c), 'return path cannot play on', deviceName(want) + ':', err.name || '', err.message || '');
    if (err.name !== 'NotFoundError' || spkId !== want) return;
    dlog('speaker', deviceName(want), 'is not available: using the default');
    rememberSpeaker('');
    listDevices();
  }
}

// switchSpeaker moves every return-path player to the output picked, at once; the players made later follow it too
// (routeSpeaker). When an output refuses, all of them go back to the previous one, and so does the picker.
async function switchSpeaker(id) {
  if (id === spkId) return;
  const was = spkId;
  dlog('speaker picked:', deviceName(id));
  rememberSpeaker(id);
  const players = [...conns.values()].map(c => c.speaker).filter(Boolean);
  if (!players.length) return;
  $('spksel').disabled = true;
  try {
    for (const el of players) await el.setSinkId(id);
    dlog(`speaker switched: the return path plays on ${deviceName(id)} (${players.length} player${players.length === 1 ? '' : 's'})`);
  } catch (err) {
    dlog('speaker switch failed:', err.name || '', err.message || '');
    rememberSpeaker(was);
    for (const el of players) el.setSinkId(was).catch(() => { /* stays where it is */ });
    $('spksel').value = was;
  } finally {
    $('spksel').disabled = false;
  }
}

// Camera: this device's camera goes to the Mac on every connection's send-only video line and comes out of the Remote
// Visio camera there. Its state for the status line, like the microphone's: a problem that left no camera open
// (camProblem), the permission prompt still waiting (camWaiting), a failed switch while the previous camera carries on
// (camNote); and from the device list and the offer, no camera at all (noCam) and no H.264 to send it with (noH264).
let camId = localStorage.getItem('camId') || '';
let camStream = null;
let camProblem = null, camWaiting = false, camNote = '', noCam = false, noH264 = false;
$('camsel').onchange = () => switchCam($('camsel').value);
$('camsel').setAttribute('aria-label', t('camera'));
if (navigator.mediaDevices) {
  navigator.mediaDevices.addEventListener('devicechange', async () => {
    const devs = await listDevices();
    if (!devs) return;
    const count = kind => devs.filter(d => d.kind === kind && !BROWSER_DEFAULTS.has(d.deviceId)).length;
    dlog(`devices changed: ${count('audioinput')} microphones, ${count('audiooutput')} speakers, ${count('videoinput')} cameras`);
  });
}

// getCam asks for one camera: the remembered one when there is one, else whatever the browser picks.
// 720p at 30 fps is what the receiver's virtual camera is sized for; more would only cost bandwidth.
function getCam(id) {
  return withTimeout(
    navigator.mediaDevices.getUserMedia({
      video: {
        deviceId: id ? { exact: id } : ANY_DEVICE,
        width: { ideal: 1280 },
        height: { ideal: 720 },
        frameRate: { ideal: 30, max: 30 },
      },
    }),
    20000,
    'The camera never responded');
}

// acquireCam opens the camera `want` (a device id, or '' for whatever the browser picks), shows the preview and
// swaps the track into every connection (replaceTrack, no renegotiation). A camera already open is released only
// once the new one is up, so a failed switch keeps the picture. Runs are queued, never concurrent: Start fires one
// without waiting for it, and a switch made meanwhile must end with the camera picked last, not race the first run.
let camQueue = Promise.resolve();
function acquireCam(want) {
  const run = () => acquireCamNow(want);
  return camQueue = camQueue.then(run, run);
}

async function acquireCamNow(want) {
  if (!live || !camOn) return; // turned off (or stopped) while this run waited its turn
  const hint = setTimeout(() => { camWaiting = true; renderStatus(); }, 2500);
  let released = ''; // a working camera let go of for the new one, to bring back if the new one fails
  try {
    let next;
    try {
      next = await getCam(want);
    } catch (err) {
      if (want && (err.name === 'OverconstrainedError' || err.name === 'NotFoundError')) {
        // The remembered camera is gone (unplugged, or the browser rotated its id): take whichever is there now.
        dlog('camera', deviceName(want), `is not available (${err.name}): using whichever is there`);
        want = '';
        camId = '';
        localStorage.removeItem('camId');
        next = await getCam('');
      } else if (camStream && err.name === 'NotReadableError') {
        // Phones often can't hold two cameras open at once: let go of the current one and try again.
        released = camStream.getVideoTracks()[0].getSettings?.().deviceId || '';
        camStream.getTracks().forEach(t => t.stop()); camStream = null;
        next = await getCam(want);
      } else {
        throw err;
      }
    }
    if (showCam(next, want)) dlog('camera:', describeTrack(next.getVideoTracks()[0]));
  } catch (err) {
    dlog('camera failed:', err.name || '', err.message || '');
    // The new camera failed after the old one was let go of: bring the old one back, so the picture stays and the
    // picker returns to it. The failed pick is not remembered; choosing it again is a fresh try.
    if (!camStream && released && released !== want) {
      try { showCam(await getCam(released), released); } catch { /* gone too; the message is about the new one */ }
    }
    if (camStream) camNote = explainCamError(err);
    else { camProblem = camProblemOf(err); attachCam(null); }
  } finally {
    clearTimeout(hint);
    camWaiting = false;
    renderTile();
    renderStatus();
    await listDevices(); // labels are known now, and the picker follows the camera in use (the list may have changed)
  }
}

// showCam makes `next` the camera in use: remembered (by the id the browser reports, else as `want`), previewed and
// sent on every connection; the previous camera, if any, is stopped. Nothing when the session ended or the camera was
// turned off meanwhile (false then).
function showCam(next, want) {
  if (!live || !camOn) { next.getTracks().forEach(t => t.stop()); return false; }
  const old = camStream;
  camStream = next;
  camProblem = null;
  camNote = '';
  const track = next.getVideoTracks()[0];
  camId = track.getSettings?.().deviceId || want;
  localStorage.setItem('camId', camId);
  // A track that ends on its own (camera unplugged, capture stopped from the browser's UI, permission revoked) is
  // not reopened -- that would be a new prompt out of nowhere -- but the tile and the status must not claim a picture
  // that is no longer sent; the picker offers the other cameras, or says there is none.
  track.onended = () => {
    if (camStream !== next) return;
    dlog('camera ended:', describeTrack(track));
    camStream = null;
    camProblem = { key: 'ended', text: t('st_stopped'), detail: t('cam_ended') };
    attachCam(null);
    $('campreview').srcObject = null;
    renderTile();
    renderStatus();
    listDevices();
  };
  attachCam(track);
  const v = $('campreview');
  v.srcObject = next;
  v.play().catch(() => { /* muted and inline, so autoplay is normally allowed */ });
  if (old) old.getTracks().forEach(t => t.stop());
  return true;
}

// releaseCam takes the camera off every connection (their video lines stay, empty), stops it and takes the preview down.
function releaseCam() {
  attachCam(null);
  if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; }
  $('campreview').srcObject = null;
  camProblem = null;
  camNote = '';
  renderTile();
}

// Switching cameras while live: open the new one and swap it in with replaceTrack; the connections stay up. The pick
// is remembered once that camera is open (a failed switch leaves the previous one in place and selected).
async function switchCam(id) {
  if (id === camId) return;
  dlog('camera picked:', deviceName(id));
  if (!live || !camOn) { camId = id; localStorage.setItem('camId', id); return; }
  $('camsel').disabled = true;
  try { await acquireCam(id); } finally { $('camsel').disabled = false; }
}

// listDevices fills the three pickers and notes when there is no camera at all. Names only come once the browser has
// been allowed a microphone or camera; until then each pill shows what it is for. The device kinds come earlier,
// enough to say up front that there is no camera to send. Runs at load, after each grant, and whenever a device is
// plugged in or pulled out. Resolves to the device list (nothing when there is none).
async function listDevices() {
  let devs;
  try { devs = await navigator.mediaDevices.enumerateDevices(); } catch { return; /* no pickers, no hint */ }
  for (const d of devs) if (d.label && !BROWSER_DEFAULTS.has(d.deviceId)) deviceNames.set(d.deviceId, d.label);
  noCam = !devs.some(d => d.kind === 'videoinput');
  fillPicker($('micsel'), devs, 'audioinput', micId, true, t('mic'));
  fillPicker($('spksel'), devs, 'audiooutput', spkId, true, t('speaker'));
  fillPicker($('camsel'), devs, 'videoinput', camId, false, noCam ? t('cam_none') : t('camera'));
  renderTile();
  renderStatus();
  return devs;
}

// fillPicker lists the named devices of one kind (but Remote Visio's) in a picker and selects `current` when it is
// there. withDefault puts the system default first (value ''), named after the device it stands for when the browser
// says which: Chromium gives its "default" entry the group of that device. The device's name comes first, as
// "MacBook Pro Microphone (System default)": a narrow pill cuts the end off, and the name is what it must show. With
// no names yet (no permission so far), the picker holds one entry, `placeholder`, which says what the pill is for.
function fillPicker(sel, devs, kind, current, withDefault, placeholder) {
  const named = devs.filter(d => d.kind === kind && d.label && !OURS.test(d.label));
  const real = named.filter(d => !BROWSER_DEFAULTS.has(d.deviceId));
  const entries = [];
  if (withDefault && real.length) {
    const def = named.find(d => d.deviceId === 'default');
    const same = def ? real.filter(d => d.groupId === def.groupId) : [];
    const name = same.length === 1 ? same[0].label : def ? def.label : '';
    entries.push(['', name ? `${name} (${t('dev_default')})` : t('dev_default')]);
  }
  for (const d of real) entries.push([d.deviceId, d.label]);
  const placeholderOnly = !entries.length;
  if (placeholderOnly) entries.push(['', placeholder]);
  sel.replaceChildren(...entries.map(([value, text]) => {
    const o = document.createElement('option');
    o.value = value;
    o.textContent = text;
    return o;
  }));
  sel.dataset.placeholder = placeholderOnly ? '1' : '0';
  if (entries.some(([value]) => value === current)) sel.value = current;
  sel.title = sel.selectedOptions[0]?.textContent || '';
}

// ---- Session ----

// session counts Starts and Stops. A run that awaited something (a permission prompt, the receiver) goes on only while
// its session is the current one: Stop then Start again, quickly, must not let the first Start's runs carry on as if
// they belonged to the second.
let session = 0;

async function start() {
  // Relay mode with nothing to send to (no computer paired, or none selected): the line under Start says so already.
  if (transport.blocked?.()) return;
  live = true;
  const mine = ++session;
  micProblem = null; micNote = ''; camProblem = null; camNote = '';
  let noAudio = null;
  try {
    ensureAudio(); // first, inside the click
  } catch (err) {
    noAudio = err;
    closeAudio();
    dlog('sound processing unavailable:', err.name || '', err.message || String(err), '(the microphone cannot be sent)');
    micProblem = { key: 'noaudio', text: t('st_error'), detail: t('mic_noaudio') };
  }
  // Relay mode: one live tab at a time, as two would keep taking the computer from each other. Asked only once the
  // sound graph is made, which must happen inside the click. Refused, the session ends at once (the line under Start
  // says why); stopped meanwhile, there is nothing left to do.
  if (transport.begin && !(await transport.begin())) {
    if (session === mine) stop();
    return;
  }
  if (session !== mine) return;
  dlog('start: profile', profile, '| microphone', micOn ? 'on' : 'off (muted)', '| speaker', spkOn ? 'on' : 'off', '| camera', camOn ? 'on' : 'off',
    '| volumes: microphone', micGain + ' %, speaker', spkVol + ' %');
  dlog('devices: microphone', deviceName(micId), '| speaker', canPickSpeaker ? deviceName(spkId) : 'default (this browser cannot pick one)',
    '| camera', deviceName(camId));
  $('toggle').textContent = t('stop');
  $('toggle').classList.add('live');
  statsTimer = setInterval(poll, 1000);
  statusTimer = setInterval(fetchStatus, 3000);
  fetchStatus();
  tickLevels();
  renderTile();
  renderStatus();

  // Mic permission and network negotiation are independent; running them serially just adds their latencies.
  // Kick off discovery and connections first (they send the graph's track, silent until the mic is in) while asking
  // for the mic in parallel.
  discover();
  discoverTimer = setInterval(discover, 30000);

  // If it takes long, the permission prompt is probably still waiting in the address bar, or another app holds the mic.
  // Stalling here with no explanation would just make the user think the product is broken.
  // (With no sound graph there is nothing to send the microphone with: it is not asked for.)
  const hint = setTimeout(() => { if (session === mine) { micWaiting = true; renderStatus(); } }, 2500);
  try {
    if (!noAudio) {
      await queueMic(async () => {
        const { next, id } = await openMic(micId);
        if (session !== mine) { next.getTracks().forEach(t => t.stop()); return; }
        rememberMic(id);
        useMic(next);
      });
    }
  } catch (err) {
    // Like a meeting: the session goes on without the microphone (the camera and the speaker may well work), and the
    // microphone's status says what to fix. Turning the microphone on again, or picking one, tries again.
    dlog('microphone failed:', err.name || '', err.message || '');
    if (session === mine) micProblem = micProblemOf(err);
  } finally {
    clearTimeout(hint);
    if (session === mine) micWaiting = false;
  }
  if (session !== mine) return; // stopped (and maybe started again) while the microphone was being asked for
  if (stream) dlog('microphone:', describeTrack(stream.getAudioTracks()[0]));
  renderStatus();
  listDevices(); // the names are known now: fill the pickers
  // The camera comes after the microphone, so the two permission prompts don't stack; a failure shows on its own
  // status line and doesn't stop the session.
  if (camOn) acquireCam(camId);
}

// discover connects to every target the transport lists: the receiver that served this page and the others it scanned
// for (receiver mode), or the selected computer (relay mode). Again every 30 s while live, as a receiver may come up.
// A transport that keeps only what it lists (relay mode: the computer selected now) also loses the others.
let discoverRun = 0; // the latest discover's: an earlier one still going leaves the list to it
async function discover() {
  if (!live) return;
  const run = ++discoverRun;
  const listed = new Set();
  for await (const target of transport.targets()) {
    if (!live || run !== discoverRun) return; // stopped, or listed again, while the list was coming
    listed.add(target.key);
    ensureConn(target);
  }
  if (!live || !transport.only || run !== discoverRun) return;
  for (const c of [...conns.values()]) if (!listed.has(c.target.key)) dropConn(c);
}

function ensureConn(target) {
  for (const c of conns.values()) {
    if (c.target.key === target.key || transport.sameTarget?.(c.target, target)) return;
  }
  const c = { target, retry: 0, state: t('connecting'), cls: 'warn', rtt: '', video: '' };
  conns.set(target.key, c);
  renderConns();
  connectOne(c);
}

// dropConn ends one connection and takes it off the list, as Stop does with all of them (relay mode: the computer is
// no longer the selected one, or was forgotten).
function dropConn(c) {
  if (conns.get(c.target.key) !== c) return;
  dlog(transport.tag(c), 'connection closed: no longer a target');
  c.gen = (c.gen || 0) + 1; // a run still under way gives up at its next step
  clearTimeout(c.retryTimer);
  clearTimeout(c.healTimer);
  transport.close(c, 'stop');
  if (c.pc) { c.pc.close(); c.pc = null; }
  detachSpeaker(c);
  conns.delete(c.target.key);
  renderConns();
  renderStatus();
}

// endConn ends a connection's attempt from the transport's side (relay mode: the computer ended it, or the encrypted
// session broke) as a failed attempt ends: the usual retry follows, unless the transport holds the connection.
function endConn(c, why) {
  if (!live || conns.get(c.target.key) !== c) return;
  c.gen = (c.gen || 0) + 1; // a run still under way gives up at its next step
  clearTimeout(c.healTimer); c.healTimer = null;
  transport.close(c);
  if (c.pc) { c.pc.close(); c.pc = null; }
  detachSpeaker(c);
  c.rtt = c.video = ''; // what the row said of the connection just closed
  scheduleRetry(c, why);
  renderConns();
  renderStatus();
}

function hostOf(target) {
  try { return new URL(target).hostname; } catch { return target; }
}

// isStale tells a run of connectOne (and of the transport's calls it makes) that it no longer counts: a newer attempt
// of the same connection started (its generation), Stop came, or the connection is no longer in the list.
function isStale(c, gen) {
  return c.gen !== gen || !live || conns.get(c.target.key) !== c;
}

// mainConn is the connection the device statuses follow: the one to the receiver that served this page (the one whose
// /api/status the page reads) or the selected computer, else the first.
function mainConn() {
  for (const c of conns.values()) if (transport.isMain(c)) return c;
  return conns.values().next().value || null;
}

// attachCam puts the camera's track (or none: null) on every established connection's video line; replaceTrack needs
// no renegotiation.
function attachCam(track) {
  for (const c of conns.values()) {
    if (!c.pc) continue;
    const sender = senderOf(c.pc, 'video');
    if (sender) {
      sender.replaceTrack(track)
        .catch(err => dlog(transport.tag(c), 'camera not attached:', err.name || '', err.message || ''));
    }
  }
}

// applyDemand starts or pauses the camera's encoding on a connection, as the other side asks (relay mode: the
// computer sends "demand" when the first page shows the camera and when the last one stops). Paused, the camera stays
// open and on the line: nothing is renegotiated, and no picture is encoded or sent for nobody.
function applyDemand(c) {
  const sender = c.pc && senderOf(c.pc, 'video');
  if (!sender) return;
  const want = c.videoWanted !== false;
  try {
    const p = sender.getParameters();
    if (!p.encodings || !p.encodings.length || p.encodings[0].active === want) return;
    p.encodings[0].active = want;
    sender.setParameters(p)
      .then(() => dlog(transport.tag(c), want ? 'camera wanted: sending it' : 'camera not wanted: paused'))
      .catch(err => dlog(transport.tag(c), 'camera demand not applied:', err.name || '', err.message || ''));
  } catch (err) {
    dlog(transport.tag(c), 'camera demand not applied:', err.name || '', err.message || '');
  }
}

// senderOf finds a connection's sender for one kind of media. Both m-lines are declared before their track exists,
// so a sender can be trackless; go by the transceiver instead -- its receiver track always carries the kind.
function senderOf(pc, kind) {
  const tx = pc.getTransceivers().find(x => x.receiver.track.kind === kind);
  return tx ? tx.sender : null;
}

// fetchWithin is fetch with a deadline for the response to begin. A receiver that takes the request and never answers
// would otherwise hold its connection on "Negotiating..." for ever, with no retry: seen with a receiver whose
// candidate gathering never finished. The error then says so, and the usual retry follows.
async function fetchWithin(ms, url, init) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), ms);
  try {
    return await fetch(url, { ...init, signal: ctl.signal });
  } catch (err) {
    if (!ctl.signal.aborted) throw err;
    const late = new Error(t('no_answer', { s: Math.round(ms / 1000) }));
    late.name = 'TimeoutError';
    throw late;
  } finally {
    clearTimeout(timer);
  }
}

// ---- Transports ----

// A transport is how the page reaches the computers it sends to. Both have the same shape, so that the connection code
// (connectOne and what it calls) is one and the same in both modes:
//   kind            'receiver' or 'relay'
//   needsH264       the other side decodes H.264 only: a browser without it cannot send the camera
//   certHint        a target's self-signed certificate may need accepting once (a cross-origin fetch then fails)
//   only            keep only the targets listed now (a connection to any other is closed)
//   jitter          (optional) how much a retry's delay varies at random, as a fraction of it
//   bundlePolicy    (optional) the RTCPeerConnection's bundle policy; the browser's default without it
//   targets()       the targets to connect to, as {key, ...}: an async iterable, so the first one starts at once
//   sameTarget(a,b) (optional) two targets with different keys that are still one computer
//   label(c)        the connection's name, for its row: plain text, always rendered with textContent
//   tag(c)          the name at the head of the connection's lines in the debug log
//   iceConfig(c)    -> {iceServers, iceTransportPolicy?, name?} for a new attempt
//   prepare(c, pc)  right after the attempt's RTCPeerConnection is made, before its offer
//   exchange(c, pc, gen) -> the answer to pc's offer; null when the attempt went stale meanwhile
//   status(c)       -> what the other side reports, {browser, camera}, or null when it reports nothing
//   isMain(c)       c is the connection the device statuses follow
//   close(c, why)   the attempt c had is over: a new one starts, or the connection ends (why = 'stop')
//   stop()          the session is over (Stop)
// Relay mode adds blocked() (nothing to send to: Start does nothing), begin() (resolves false to refuse Start),
// linkArrived() (a pairing link came in through the fragment) and hiccup(c) (c's connection lost its peer for now).
// A transport may hold a connection (c.hold, the reason, shown in its row): no automatic retry then. And a connection's
// row may carry buttons (c.actions: [{text, run}]).

// The receiver transport: the receivers this page can reach over HTTP. It is the code this page always had, moved
// here: /api/receivers, /ice-config, the offer POSTed with its candidates, and /api/status.
let lastDiscovered = null; // the debug log notes the list when it changes, not every 30 s
const receiverTransport = {
  kind: 'receiver', needsH264: true, certHint: true, only: false,

  // The receiver that served this page, at once; then the others it scanned for. The browser can't reach the
  // Tailscale device list itself, so the receiver does it (/api/receivers).
  async *targets() {
    yield { key: location.origin };
    let found, list = [];
    try {
      const res = await fetch('/api/receivers');
      if (res.ok) {
        list = await res.json();
        found = list.length ? list.join(', ') : 'none';
      } else {
        found = `failed (HTTP ${res.status})`;
      }
    } catch (err) { /* no list: connect to this receiver only */
      found = `failed (${err.message || err})`;
    }
    for (const key of list) yield { key };
    if (found !== lastDiscovered) { lastDiscovered = found; dlog('other receivers:', found); }
  },
  // One receiver per host: its page's own address and the scan's entry for it are the same machine.
  sameTarget(a, b) { return hostOf(a.key) === hostOf(b.key); },
  label(c) { return (c.name ? c.name + ' · ' : '') + hostOf(c.target.key); },
  tag(c) { return hostOf(c.target.key); },

  // Each receiver serves its own /ice-config (same TURN set); fetched cross-origin.
  async iceConfig(c) {
    const target = c.target.key;
    try {
      const res = await fetchWithin(5000, target + '/ice-config');
      if (res.ok) return await res.json();
      dlog(hostOf(target), 'ice-config: HTTP', res.status, '(using the default STUN server)');
    } catch (err) { /* fall back to the default below */
      dlog(hostOf(target), 'ice-config failed:', err.message || err, '(using the default STUN server)');
    }
    return { iceServers: [{ urls: 'stun:stun.miwifi.com:3478' }] };
  },

  prepare() {},

  // The receiver takes the offer whole, with this side's candidates in it (it does not trickle), and answers the POST.
  async exchange(c, pc, gen) {
    const h = hostOf(c.target.key);
    // Wait for candidate gathering, but at most 3 s: when STUN is unreachable, don't sit through the browser's full 10 s.
    await new Promise(done => {
      if (pc.iceGatheringState === 'complete') return done();
      const cap = setTimeout(() => { dlog(h, 'gathering not complete after 3 s: sending the candidates found so far'); done(); }, 3000);
      pc.onicegatheringstatechange = () => {
        if (pc.iceGatheringState === 'complete') { clearTimeout(cap); done(); }
      };
    });
    if (isStale(c, gen)) return null;

    setConnState(c, t('negotiating'), 'warn');
    const sent = (pc.localDescription.sdp.match(/^a=candidate:/gm) || []).length;
    dlog(h, `sending the offer (${sent} candidate${sent === 1 ? '' : 's'})`);
    const asked = performance.now();
    const res = await fetchWithin(15000, c.target.key + '/offer', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(pc.localDescription),
    });
    if (isStale(c, gen)) return null;
    dlog(h, `offer answered: HTTP ${res.status} in ${Math.round(performance.now() - asked)} ms`);
    if (!res.ok) throw new Error(await res.text());
    const answer = await res.json();
    const theirs = String(answer.sdp || '').split(/\r?\n/).filter(l => l.startsWith('a=candidate:'));
    for (const l of theirs) dlog(h, 'receiver candidate:', describeCandidate(l));
    if (!theirs.length) dlog(h, 'the receiver sent no candidates');
    return answer;
  },

  // The receiver that served this page says which pages on the Mac use its devices (/api/status). An older receiver
  // has no such endpoint: null then.
  async status() {
    try {
      const res = await fetchWithin(2500, '/api/status', { cache: 'no-store' });
      if (res.ok) return await res.json();
    } catch { /* below */ }
    return null;
  },

  isMain(c) { return hostOf(c.target.key) === location.hostname; },
  close() {},
  stop() {},
};

// The transport in use. Relay mode swaps in relay.js's once it has loaded (see the end of this script); Start waits
// for it.
let transport = receiverTransport;

// connectOne maintains the connection to one receiver (relay mode: to the selected computer). On loss it reconnects
// with backoff -- network recovery, receiver restart, and waking from sleep all go through this path with no extra
// button press.
async function connectOne(c) {
  if (!live) return;
  clearTimeout(c.retryTimer); c.retryTimer = null;
  if (c.pc) { c.pc.close(); c.pc = null; }
  detachSpeaker(c);
  // A retry and a recovery may both trigger a rebuild of the same connection. Last one wins:
  // each entry bumps a generation token, and an earlier run bails after any await once it sees it is stale --
  // no orphaned connections, and no stray retry scheduled in its catch on behalf of the newer one. Stop bumps it too,
  // and a connection no longer in the list (Stop cleared it; a new Start made its own) is stale for good.
  const gen = c.gen = (c.gen || 0) + 1;
  const stale = () => isStale(c, gen);
  // What the previous attempt had on the transport's side (relay mode: its relay socket and encrypted session) ends
  // with it.
  transport.close(c);

  const h = transport.tag(c);
  try {
    setConnState(c, t('establishing'), 'warn');
    dlog(h, `--- connecting (attempt ${c.retry + 1})`);
    const cfg = await transport.iceConfig(c);
    if (stale()) return;
    if (cfg.name) { c.name = cfg.name; }
    dlog(h, transport.kind === 'relay' ? 'computer' : 'receiver', cfg.name ? `"${cfg.name}"` : '(no name)', '| ICE servers:', describeICE(cfg.iceServers));
    // Relay mode: the computer may ask for relayed candidates only (its "Always relay through TURN" test setting), and
