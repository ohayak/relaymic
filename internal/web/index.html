<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/favicon-96.png" sizes="96x96" type="image/png">
<link rel="apple-touch-icon" href="/favicon-96.png">
<title>Remote Visio</title>
<style>
  :root {
    --bg: #0f1115;
    --fg: #e8eaed;
    --dim: #8a8f98;
    --line: #262a33;
    --ok: #35c46b;
    --warn: #e0a034;
    --err: #e05a4f;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.6 -apple-system, "Segoe UI", system-ui, sans-serif;
    padding: 24px;
  }
  main { width: 100%; max-width: 380px; }
  h1 { font-size: 17px; font-weight: 600; margin: 0 0 4px; }
  .target { color: var(--dim); font-size: 13px; margin-bottom: 28px; }

  button {
    width: 100%;
    padding: 16px;
    font-size: 16px;
    font-weight: 600;
    font-family: inherit;
    color: var(--bg);
    background: var(--fg);
    border: 0;
    border-radius: 10px;
    cursor: pointer;
  }
  button:disabled { opacity: .4; cursor: default; }
  button.live { background: var(--err); color: #fff; }

  .meter {
    height: 4px;
    margin: 20px 0;
    background: var(--line);
    border-radius: 2px;
    overflow: hidden;
  }
  .meter i {
    display: block;
    height: 100%;
    width: 0;
    background: var(--ok);
    transition: width .08s linear;
  }

  .profiles {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
  }
  .profiles button {
    flex: 1;
    padding: 8px 4px;
    font-size: 13px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: none;
    color: var(--dim);
    cursor: pointer;
  }
  .profiles button.on {
    color: inherit;
    border-color: currentColor;
    font-weight: 600;
  }

  .hear {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--dim);
    margin-bottom: 12px;
    cursor: pointer;
  }
  .hear input { margin: 0; }

  /* Camera picker, indented under its checkbox; shown only once labels are known and there is a choice to make. */
  .camsel {
    display: block;
    width: calc(100% - 22px);
    margin: -4px 0 12px 22px;
    padding: 6px 8px;
    font: inherit;
    font-size: 13px;
    color: var(--fg);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  .campreview {
    display: block;
    max-width: 160px;
    margin: 0 0 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #000;
  }

  .micstate { font-size: 13px; color: var(--dim); min-height: 18px; margin-bottom: 8px; }
  .camstate:empty { display: none; }
  .conns {
    font-size: 13px;
    border-top: 1px solid var(--line);
    padding-top: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .conn { display: flex; align-items: baseline; gap: 10px; }
  .conn .host { font-variant-numeric: tabular-nums; }
  .conn .st { flex: 1; text-align: right; }
  .conn .rtt { color: var(--dim); font-variant-numeric: tabular-nums; min-width: 52px; text-align: right; }
  .conn .vid { color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .empty { color: var(--dim); }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .err { color: var(--err); }
  .src {
    margin-top: 28px;
    text-align: center;
    font-size: 12px;
    opacity: .45;
  }
  .src a { color: inherit; }

  /* Debug log (?debug=1, or the link at the bottom): wider, so a candidate pair fits on a line. */
  main.debugging { max-width: 720px; }
  .debug { margin-top: 20px; border-top: 1px solid var(--line); padding-top: 12px; }
  .debughead { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--dim); margin-bottom: 8px; }
  .debughead span { flex: 1; }
  .debughead button {
    width: auto;
    padding: 4px 12px;
    font-size: 12px;
    font-weight: 500;
    color: var(--fg);
    background: none;
    border: 1px solid var(--line);
    border-radius: 6px;
  }
  .debuglog {
    margin: 0;
    max-height: 50vh;
    overflow: auto;
    padding: 8px;
    font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--dim);
    white-space: pre-wrap;
    word-break: break-all;
    background: #0a0c0f;
    border: 1px solid var(--line);
    border-radius: 8px;
  }
</style>
</head>
<body>
<main>
  <h1 data-i18n="title">Remote Visio</h1>
  <div class="target" id="target">—</div>

  <div class="profiles" id="profiles"></div>
  <label class="hear"><input type="checkbox" id="hear"> <span data-i18n="hear">Hear the remote Mac (meeting audio, alerts)</span></label>
  <label class="hear"><input type="checkbox" id="cam"> <span data-i18n="cam">Send this device's camera</span></label>
  <select id="camsel" class="camsel" hidden></select>

  <button id="toggle" data-i18n="start">Start talking</button>
  <div class="meter"><i id="level"></i></div>
  <video id="campreview" class="campreview" muted playsinline autoplay hidden></video>

  <div id="micstate" class="micstate"></div>
  <div id="camstate" class="micstate camstate"></div>
  <div id="conns" class="conns"><div class="empty" data-i18n="not_connected">Not connected</div></div>

  <section id="debug" class="debug" hidden>
    <div class="debughead">
      <span data-i18n="debug">Debug log</span>
      <button type="button" id="debugcopy" data-i18n="debug_copy">Copy</button>
      <button type="button" id="debugclear" data-i18n="debug_clear">Clear</button>
    </div>
    <pre id="debuglog" class="debuglog"></pre>
  </section>

  <!-- AGPL-3.0 section 13: users interacting with this program over a network must be able to get
       the matching source. The sender is this page, so the link lives here; it is not optional decoration.
       If you modify this code and serve it to others, point this link at your own copy. -->
  <footer class="src">
    Remote Visio · <a href="https://github.com/hueshu/relaymic" target="_blank" rel="noopener" data-i18n="source">Source (AGPL-3.0)</a>
    · <a href="#" id="debuglink" data-i18n="debug">Debug log</a>
  </footer>
</main>

    mic_waiting: 'माइक्रोफ़ोन की अनुमति का इंतज़ार है: एड्रेस बार के बाईं ओर दिख रहे संकेत को देखें',
    connecting: 'कनेक्ट हो रहा है...', establishing: 'कनेक्शन बनाया जा रहा है...', negotiating: 'बातचीत जारी है...',
    connected: 'कनेक्ट हो गया', hiccup: 'नेटवर्क में रुकावट, ठीक होने का इंतज़ार...',
    failed: 'कनेक्शन विफल', closed: 'कनेक्शन बंद', not_recovered: 'ठीक नहीं हुआ',
    retry: '{why}, {s} सेकंड में फिर से कनेक्ट होगा',
    cert_before: 'पहुँच नहीं हो पा रही - पहली बार ', cert_link: 'इसे एक बार खोलें', cert_after: ' और प्रमाणपत्र स्वीकार करें',
    relay: 'रिले', playing: 'इस Mac की आवाज़ चल रही है',
    mic_denied: 'माइक्रोफ़ोन की अनुमति नहीं मिली: एड्रेस बार के बाईं ओर के आइकन पर क्लिक करके अनुमति दें',
    mic_notfound: 'इस डिवाइस पर कोई माइक्रोफ़ोन नहीं मिला',
    mic_busy: 'माइक्रोफ़ोन किसी और प्रोग्राम के पास है: मीटिंग/रिकॉर्डिंग ऐप और दूसरे टैब बंद करें',
    mic_constraints: 'माइक्रोफ़ोन ज़रूरी सेटिंग्स का समर्थन नहीं करता',
    mic_other: 'माइक्रोफ़ोन नहीं मिल सका: {reason}', unknown: 'अज्ञात कारण',
    cam: 'इस डिवाइस का कैमरा भेजें',
    cam_none: 'कोई कैमरा नहीं मिला',
    cam_waiting: 'कैमरे की अनुमति का इंतज़ार है: एड्रेस बार के बाईं ओर दिख रहे संकेत को देखें',
    cam_denied: 'कैमरे की अनुमति नहीं मिली: एड्रेस बार के बाईं ओर के आइकन पर क्लिक करके अनुमति दें',
    cam_notfound: 'इस डिवाइस पर कोई कैमरा नहीं मिला',
    cam_busy: 'कैमरा किसी और ऐप के पास है: मीटिंग/वीडियो ऐप और दूसरे टैब बंद करें',
    cam_constraints: 'कैमरा ज़रूरी सेटिंग्स का समर्थन नहीं करता',
    cam_other: 'कैमरे में गड़बड़ी: {err}',
    cam_noh264: 'यह ब्राउज़र H.264 वीडियो नहीं भेज सकता; कैमरा आगे नहीं भेजा जाएगा',
    sending_video: 'कैमरा भेजा जा रहा है',
    cam_declined: 'कैमरा नहीं भेजा गया: Mac पर वर्चुअल कैमरा नहीं है',
    debug: 'डीबग लॉग', debug_copy: 'कॉपी करें', debug_clear: 'साफ़ करें', debug_copied: 'कॉपी हो गया',
    no_answer: 'रिसीवर ने {s} सेकंड में जवाब नहीं दिया',
  },
};
</script>
<script src="/i18n.js"></script>
<script>
let stream = null, statsTimer = null, rafId = null, audioCtx = null;
let live = false, discoverTimer = null;

// One independent connection per receiver: each negotiates and reconnects on its own, so one going down doesn't affect the rest.
// conns: origin string -> { target, pc, retry, retryTimer, healTimer, state, cls, rtt, needCert }
const conns = new Map();

$('target').textContent = t('target', { host: location.host });

// Debug log. A connection stuck on "Connecting" says nothing about why, and a phone has no developer tools. So the
// page keeps a log of what it does -- permissions, discovery, and for each connection its ICE candidates (this
// device's and the receiver's), its states, and its candidate pairs with the checks sent and answered each way -- and
// shows it under the connections with ?debug=1, or the link at the bottom (?debug=0 hides it again; the choice is
// remembered). It is kept either way, so turning it on shows what already happened. It holds network addresses but
// never TURN credentials, and leaves this page only when the user copies it.
const DEBUG_MAX = 1500;
const debugLines = [];
let debugOn = (() => {
  const q = new URLSearchParams(location.search).get('debug');
  if (q === '1' || q === '0') localStorage.setItem('debug', q);
  return localStorage.getItem('debug') === '1';
})();

function dlog(...parts) {
  const d = new Date();
  const line = d.toTimeString().slice(0, 8) + '.' + String(d.getMilliseconds()).padStart(3, '0') + ' ' + parts.join(' ');
  debugLines.push(line);
  if (debugLines.length > DEBUG_MAX) debugLines.shift();
  console.debug('[remotevisio]', line);
  if (!debugOn) return;
  const pre = $('debuglog');
  const atEnd = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 4;
  pre.append(line + '\n');
  while (pre.childNodes.length > DEBUG_MAX) pre.firstChild.remove();
  if (atEnd) pre.scrollTop = pre.scrollHeight;
}

function renderDebug() {
  $('debug').hidden = !debugOn;
  document.querySelector('main').classList.toggle('debugging', debugOn);
  const pre = $('debuglog');
  if (!debugOn) { pre.replaceChildren(); return; }
  pre.replaceChildren(...debugLines.map(l => l + '\n'));
  pre.scrollTop = pre.scrollHeight;
}
renderDebug();

$('debuglink').onclick = e => {
  e.preventDefault();
  debugOn = !debugOn;
  localStorage.setItem('debug', debugOn ? '1' : '0');
  renderDebug();
};
$('debugclear').onclick = () => { debugLines.length = 0; $('debuglog').replaceChildren(); };
$('debugcopy').onclick = async () => {
  try {
    await navigator.clipboard.writeText(debugLines.join('\n') + '\n');
  } catch {
    // No clipboard access (an older browser): select the log, so it can be copied by hand.
    const r = document.createRange();
    r.selectNodeContents($('debuglog'));
    getSelection().removeAllRanges();
    getSelection().addRange(r);
    return;
  }
  $('debugcopy').textContent = t('debug_copied');
  setTimeout(() => { $('debugcopy').textContent = t('debug_copy'); }, 1500);
};

dlog('page', location.href);
dlog('browser', navigator.userAgent);
dlog('secure context', isSecureContext, '| WebRTC', typeof RTCPeerConnection === 'function', '| language', LANG);
addEventListener('error', e => dlog('page error:', e.message, e.filename ? `(${e.filename}:${e.lineno})` : ''));
addEventListener('unhandledrejection', e => dlog('unhandled rejection:', String((e.reason && e.reason.message) || e.reason)));

// describeCandidate turns an ICE candidate line ("candidate:... 1 udp 2122260223 192.168.1.5 54321 typ host ...")
// into "host udp 192.168.1.5:54321"; a server-reflexive or relay candidate also names the address it stands for.
function describeCandidate(line) {
  const f = String(line).replace(/^a=/, '').replace(/^candidate:/, '').trim().split(/\s+/);
  if (f.length < 8 || f[6] !== 'typ') return String(line);
  let s = `${f[7]} ${f[2].toLowerCase()} ${f[4]}:${f[5]}`;
  const ra = f.indexOf('raddr'), rp = f.indexOf('rport');
  if (ra > 0 && rp > 0) s += ` (for ${f[ra + 1]}:${f[rp + 1]})`;
  const tt = f.indexOf('tcptype');
  if (tt > 0) s += ` tcptype ${f[tt + 1]}`;
  if (f[1] !== '1') s += ` component ${f[1]}`;
  return s;
}

// describeTrack names a microphone or camera and the settings the browser gave it.
function describeTrack(track) {
  if (!track) return 'none';
  const s = track.getSettings ? track.getSettings() : {};
  const keep = ['width', 'height', 'frameRate', 'sampleRate', 'channelCount', 'echoCancellation', 'noiseSuppression', 'autoGainControl'];
  const parts = keep.filter(k => s[k] !== undefined).map(k => `${k}=${typeof s[k] === 'number' ? Math.round(s[k] * 100) / 100 : s[k]}`);
  return (track.label || '(no name)') + (parts.length ? ' ' + parts.join(' ') : '');
}

// describeICE lists the STUN/TURN servers' URLs; never their credentials.
function describeICE(servers) {
  const urls = (servers || []).flatMap(s => [].concat(s.urls || s.url || []));
  return urls.length ? urls.join(', ') : 'none';
}

// debugPairs logs a connection's candidate pairs. While it is not connected: all of them, every few seconds (or at
// once with force), each with the checks sent and answered in both directions -- that tells "nothing gets through"
// from "only one way does". Once connected: the pair in use, when it changes.
function debugPairs(c, pc, stats, force) {
  const h = hostOf(c.target);
  const state = pc.iceConnectionState;
  const pairs = [];
  let chosen = null;
  stats.forEach(r => {
    if (r.type === 'candidate-pair') pairs.push(r);
    if (r.type === 'transport' && r.selectedCandidatePairId) chosen = r.selectedCandidatePairId;
  });
  const side = id => {
    const x = stats.get(id);
    return x ? `${x.candidateType} ${x.protocol} ${x.address ?? x.ip}:${x.port}` : '?';
  };
  const describe = p => `${side(p.localCandidateId)} -> ${side(p.remoteCandidateId)}: ${p.state}${p.nominated ? ', nominated' : ''}` +
    `, checks sent ${p.requestsSent ?? 0} answered ${p.responsesReceived ?? 0}` +
    `, checks received ${p.requestsReceived ?? 0} answered ${p.responsesSent ?? 0}`;
  if (state === 'connected' || state === 'completed') {
    const p = (chosen && stats.get(chosen)) || pairs.find(x => x.state === 'succeeded' && x.nominated);
    const key = p ? p.localCandidateId + '|' + p.remoteCandidateId : '';
    if (p && key !== c.debugChosen) {
      c.debugChosen = key;
      dlog(h, 'in use:', describe(p) + (p.currentRoundTripTime != null ? `, RTT ${Math.round(p.currentRoundTripTime * 1000)} ms` : ''));
    }
    return;
  }
  c.debugChosen = '';
  const now = Date.now();
  if (!force && now - (c.debugPairsAt || 0) < 5000) return;
  c.debugPairsAt = now;
  if (!pairs.length) { dlog(h, `ICE ${state}: no candidate pairs${state === 'new' || state === 'checking' ? ' yet' : ''}`); return; }
  dlog(h, `ICE ${state}: ${pairs.length} candidate pair${pairs.length === 1 ? '' : 's'}`);
  for (const p of pairs) dlog(h, '  ' + describe(p));
}

$('toggle').onclick = () => (live ? stop() : start());

// Audio profiles: switch a whole group of settings at once instead of tuning one knob at a time.
// The three tiers cover three real problems seen while troubleshooting: bubbly noise-suppression artifacts, background hiss, bad gain.
const PROFILES = {
  denoise: { label: 'profile_denoise', ns: true,  agc: true  }, // noisy room, mic level fine
  clean:   { label: 'profile_clean',   ns: false, agc: true  }, // use when noise suppression sounds bubbly
  raw:     { label: 'profile_raw',     ns: false, agc: false }, // leave everything to the receiver's AGC
};
let profile = localStorage.getItem('profile');
// Backwards compatibility with the old ?ns=0 usage
if (!PROFILES[profile]) profile = new URLSearchParams(location.search).get('ns') === '0' ? 'clean' : 'denoise';

for (const [key, p] of Object.entries(PROFILES)) {
  const b = document.createElement('button');
  b.textContent = t(p.label);
  b.dataset.key = key;
  b.onclick = () => switchProfile(key);
  $('profiles').appendChild(b);
}
renderProfiles();

function renderProfiles() {
  for (const b of $('profiles').children) b.classList.toggle('on', b.dataset.key === profile);
}

// Switching while live: grab a new track with the new constraints and swap it in via replaceTrack,
// so the connection stays up with no renegotiation. When not live, just remember the choice for the next start.
async function switchProfile(key) {
  if (key === profile) return;
  profile = key;
  localStorage.setItem('profile', key);
  renderProfiles();
  if (!live) return;
  await reacquireMic();
}

// Return path: the remote Mac's system audio (other people in a meeting, alerts, video) plays out here,
// so the remote-desktop software's audio transport can be turned off. On by default.
let hear = localStorage.getItem('hear') !== '0';
$('hear').checked = hear;
$('hear').onchange = () => toggleHear($('hear').checked);

async function toggleHear(on) {
  hear = on;
  localStorage.setItem('hear', on ? '1' : '0');
  if (!live) return;
  // The mic's echo cancellation follows this switch (replaceTrack, seamless); but whether we receive the
  // return path lives in the m-line direction, so the connection must be rebuilt, with a brief drop -- this toggle is rarely used.
  // Lock the checkbox during the rebuild so a double click can't start two rebuilds that trample each other.
  $('hear').disabled = true;
  try {
    await reacquireMic();
    for (const c of conns.values()) connectOne(c);
  } finally {
    $('hear').disabled = false;
  }
}

// reacquireMic re-acquires the mic with the current settings and swaps it seamlessly into every connection.
async function reacquireMic() {
  try {
    const next = await getMic();
    if (!live) { next.getTracks().forEach(t => t.stop()); return; }
    const old = stream;
    stream = next;
    attachMic();
    cancelAnimationFrame(rafId); rafId = null;
    if (audioCtx) { audioCtx.close(); audioCtx = null; }
    meter(stream);
    if (old) old.getTracks().forEach(t => t.stop());
  } catch (err) {
    $('micstate').textContent = explainMicError(err);
  }
}

// getMic acquires the microphone for the current profile.
// Gain is handled centrally by the receiver; this side only wants a fairly raw signal.
// Echo cancellation is on only while hearing the return path: the remote audio plays from the local
// speakers, the mic would send it straight back, and the browser's AEC knows exactly what it played.
// Without the return path nothing can loop back, so leaving it on only adds latency.
function getMic() {
  const p = PROFILES[profile];
  return withTimeout(
    navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: hear,
        noiseSuppression: p.ns,
        autoGainControl: p.agc,
      },
    }),
    20000,
    'The microphone never responded');
}

// Camera: this device's camera goes to the Mac as a second, send-only track and comes out of the Remote Visio virtual
// camera there. Off by default: it costs bandwidth and a second permission prompt, and most sessions are voice only.
let cam = localStorage.getItem('cam') === '1';
let camId = localStorage.getItem('camId') || '';
let camStream = null;
// The camera status line shows, in order: the last acquisition problem, "no camera" from the device list, the codec warning.
let camErr = '', noCam = false, noH264 = false;
$('cam').checked = cam;
$('cam').onchange = () => toggleCam($('cam').checked);
$('camsel').onchange = () => switchCam($('camsel').value);
if (navigator.mediaDevices) navigator.mediaDevices.addEventListener('devicechange', listCams);
listCams();

function renderCamState() {
  $('camstate').textContent = camErr || (cam && noCam ? t('cam_none') : '') || (cam && noH264 ? t('cam_noh264') : '');
}

async function toggleCam(on) {
  cam = on;
  localStorage.setItem('cam', on ? '1' : '0');
  if (!live) { if (on) listCams(); else releaseCam(); return; }
  // Like the return path, the camera lives in the m-line layout, so switching it takes a rebuild (brief drop);
  // the checkbox is locked meanwhile so a double click can't start two rebuilds that trample each other.
  $('cam').disabled = true;
  try {
    if (on) {
      await acquireCam(camId);
      if (!camStream) return; // nothing to send; the status line says why
    } else {
      releaseCam();
    }
    for (const c of conns.values()) connectOne(c);
  } finally {
    $('cam').disabled = false;
  }
}

// getCam asks for one camera: the remembered one when there is one, else whatever the browser picks.
// 720p at 30 fps is what the receiver's virtual camera is sized for; more would only cost bandwidth.
function getCam(id) {
  return withTimeout(
    navigator.mediaDevices.getUserMedia({
      video: {
        deviceId: id ? { exact: id } : undefined,
        width: { ideal: 1280 },
        height: { ideal: 720 },
        frameRate: { ideal: 30, max: 30 },
      },
    }),
    20000,
    'The camera never responded');
}

// acquireCam opens the camera `want` (a device id, or '' for whatever the browser picks), shows the preview and
// swaps the track into every connection (replaceTrack, no renegotiation). A camera already open is released only
// once the new one is up, so a failed switch keeps the picture. Runs are queued, never concurrent: Start fires one
// without waiting for it, and a switch made meanwhile must end with the camera picked last, not race the first run.
let camQueue = Promise.resolve();
function acquireCam(want) {
  const run = () => acquireCamNow(want);
  return camQueue = camQueue.then(run, run);
}

async function acquireCamNow(want) {
  const hint = setTimeout(() => { camErr = t('cam_waiting'); renderCamState(); }, 2500);
  let released = ''; // a working camera let go of for the new one, to bring back if the new one fails
  try {
    let next;
    try {
      next = await getCam(want);
    } catch (err) {
      if (want && (err.name === 'OverconstrainedError' || err.name === 'NotFoundError')) {
        // The remembered camera is gone (unplugged, or the browser rotated its id): take whichever is there now.
        want = '';
        camId = '';
        localStorage.removeItem('camId');
        next = await getCam('');
      } else if (camStream && err.name === 'NotReadableError') {
        // Phones often can't hold two cameras open at once: let go of the current one and try again.
        released = camStream.getVideoTracks()[0].getSettings?.().deviceId || '';
        camStream.getTracks().forEach(t => t.stop()); camStream = null;
        next = await getCam(want);
      } else {
        throw err;
      }
    }
    showCam(next, want);
    camErr = '';
    dlog('camera:', describeTrack(next.getVideoTracks()[0]));
  } catch (err) {
    dlog('camera failed:', err.name || '', err.message || '');
    camErr = explainCamError(err);
    // The new camera failed after the old one was let go of: bring the old one back, so the picture stays and the
    // picker returns to it. The failed pick is not remembered; choosing it again is a fresh try.
    if (!camStream && released && released !== want) {
      try { showCam(await getCam(released), released); } catch { /* gone too; the message is about the new one */ }
    }
    if (!camStream) { attachCam(null); $('campreview').hidden = true; }
  } finally {
    clearTimeout(hint);
    renderCamState();
    await listCams(); // labels are known now, and the picker follows the camera in use (the list may have changed)
  }
}

// showCam makes `next` the camera in use: remembered (by the id the browser reports, else as `want`), previewed and
// sent on every connection; the previous camera, if any, is stopped. Nothing when the session ended meanwhile.
function showCam(next, want) {
  if (!live || !cam) { next.getTracks().forEach(t => t.stop()); return; }
  const old = camStream;
  camStream = next;
  const track = next.getVideoTracks()[0];
  camId = track.getSettings?.().deviceId || want;
  localStorage.setItem('camId', camId);
  // A track that ends on its own (camera unplugged, capture stopped from the browser's UI, permission revoked) is
  // not reopened -- that would be a new prompt out of nowhere -- but the badge and preview must not claim a picture
  // that is no longer sent; the picker offers the other cameras, or says there is none.
  track.onended = () => {
    if (camStream !== next) return;
    camStream = null;
    attachCam(null);
    $('campreview').srcObject = null;
    $('campreview').hidden = true;
    listCams();
  };
  attachCam(track);
  const v = $('campreview');
  v.srcObject = next;
  v.hidden = false;
  v.play().catch(() => { /* muted and inline, so autoplay is normally allowed */ });
  if (old) old.getTracks().forEach(t => t.stop());
}

// releaseCam stops the camera and takes the preview down; the connections keep their video line until the next rebuild.
function releaseCam() {
  if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; }
  const v = $('campreview');
  v.srcObject = null;
  v.hidden = true;
  camErr = '';
  renderCamState();
  listCams(); // hides the picker when the camera is off
}

// Switching cameras while live: open the new one and swap it in with replaceTrack; the connections stay up. The pick
// is remembered once that camera is open (a failed switch leaves the previous one in place and selected).
async function switchCam(id) {
  if (id === camId) return;
  if (!live || !cam) { camId = id; localStorage.setItem('camId', id); return; }
  $('camsel').disabled = true;
  try { await acquireCam(id); } finally { $('camsel').disabled = false; }
}

// listCams fills the camera picker and notes when there is no camera at all. Labels (and so the picker) only come once
// a camera has been granted; the device kinds come earlier, enough to say up front that there is nothing to send.
// Runs at load, after each grant, and whenever a camera is plugged in or pulled out.
async function listCams() {
  let devs;
  try { devs = await navigator.mediaDevices.enumerateDevices(); } catch { return; /* no picker, no hint */ }
  const cams = devs.filter(d => d.kind === 'videoinput');
  const sel = $('camsel');
  sel.innerHTML = '';
  for (const d of cams) {
    if (!d.label) continue;
    const o = document.createElement('option');
    o.value = d.deviceId;
    o.textContent = d.label;
    sel.appendChild(o);
  }
  if (cams.some(d => d.deviceId === camId)) sel.value = camId;
  sel.hidden = !cam || sel.options.length < 2; // one camera needs no picker
  noCam = cams.length === 0;
  renderCamState();
}

async function start() {
  live = true;
  dlog('start: profile', profile, '| return path', hear ? 'on' : 'off', '| camera', cam ? 'on' : 'off');
  $('toggle').textContent = t('stop');
  $('toggle').classList.add('live');

  // Mic permission and network negotiation are independent; running them serially just adds their latencies.
  // Kick off discovery and connections first (track attached later) while asking for the mic in parallel.
  discover();
  discoverTimer = setInterval(discover, 30000);

  try {
    // If it takes long, the permission prompt is probably still waiting in the address bar, or another app holds the mic.
    // Stalling here with no explanation would just make the user think the product is broken.
    const hint = setTimeout(() => {
      $('micstate').textContent = t('mic_waiting');
    }, 2500);

    stream = await getMic();
    clearTimeout(hint);
    $('micstate').textContent = '';
    dlog('microphone:', describeTrack(stream.getAudioTracks()[0]));
  } catch (err) {
    dlog('microphone failed:', err.name || '', err.message || '');
    $('micstate').textContent = explainMicError(err);
    stop();
    return;
  }
  meter(stream);
  attachMic();
  // The camera is optional: a failure shows on its own status line and doesn't stop the session.
  if (cam) acquireCam(camId);
}

// discover finds all receivers: the one that served this page plus the others it scanned for us.
// The browser can't reach the Tailscale device list itself, so the receiver does it (/api/receivers).
let lastDiscovered = null; // the debug log notes the list when it changes, not every 30 s
async function discover() {
  if (!live) return;
  ensureConn(location.origin);
  let found;
  try {
    const res = await fetch('/api/receivers');
    if (res.ok) {
      const list = await res.json();
      found = list.length ? list.join(', ') : 'none';
      for (const t of list) ensureConn(t);
    } else {
      found = `failed (HTTP ${res.status})`;
    }
  } catch (err) { /* no list: connect to this receiver only */
    found = `failed (${err.message || err})`;
  }
  if (found !== lastDiscovered) { lastDiscovered = found; dlog('other receivers:', found); }
}

function ensureConn(target) {
  const key = hostOf(target);
  for (const c of conns.values()) if (hostOf(c.target) === key) return;
  const c = { target, retry: 0, state: t('connecting'), cls: 'warn', rtt: '', video: '' };
  conns.set(target, c);
  renderConns();
  connectOne(c);
}

function hostOf(target) {
  try { return new URL(target).hostname; } catch { return target; }
}

// attachMic pushes the mic track into every established connection. replaceTrack doesn't trigger
// renegotiation, so connections can be built first and start streaming as soon as the track arrives.
function attachMic() {
  if (!stream) return;
  for (const c of conns.values()) {
    if (!c.pc) continue;
    const sender = senderOf(c.pc, 'audio');
    if (sender) sender.replaceTrack(stream.getAudioTracks()[0]);
  }
}

// attachCam does the same for the camera; null takes the picture away without a rebuild.
function attachCam(track) {
  for (const c of conns.values()) {
    if (!c.pc) continue;
    const sender = senderOf(c.pc, 'video');
    if (sender) sender.replaceTrack(track);
  }
}

// senderOf finds a connection's sender for one kind of media. Both m-lines are declared before their track exists,
// so a sender can be trackless; go by the transceiver instead -- its receiver track always carries the kind.
function senderOf(pc, kind) {
  const tx = pc.getTransceivers().find(x => x.receiver.track.kind === kind);
  return tx ? tx.sender : null;
}

// fetchWithin is fetch with a deadline for the response to begin. A receiver that takes the request and never answers
// would otherwise hold its connection on "Negotiating..." for ever, with no retry: seen with a receiver whose
// candidate gathering never finished. The error then says so, and the usual retry follows.
async function fetchWithin(ms, url, init) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), ms);
  try {
    return await fetch(url, { ...init, signal: ctl.signal });
  } catch (err) {
    if (!ctl.signal.aborted) throw err;
    const late = new Error(t('no_answer', { s: Math.round(ms / 1000) }));
    late.name = 'TimeoutError';
    throw late;
  } finally {
    clearTimeout(timer);
  }
}

// Each receiver serves its own /ice-config (same TURN set); fetched cross-origin.
async function loadICE(target) {
  try {
    const res = await fetchWithin(5000, target + '/ice-config');
    if (res.ok) return await res.json();
    dlog(hostOf(target), 'ice-config: HTTP', res.status, '(using the default STUN server)');
  } catch (err) { /* fall back to the default below */
    dlog(hostOf(target), 'ice-config failed:', err.message || err, '(using the default STUN server)');
  }
  return { iceServers: [{ urls: 'stun:stun.miwifi.com:3478' }] };
}

// connectOne maintains the connection to one receiver. On loss it reconnects with backoff -- network
// recovery, receiver restart, and waking from sleep all go through this path with no extra button press.
async function connectOne(c) {
  if (!live) return;
  clearTimeout(c.retryTimer); c.retryTimer = null;
  if (c.pc) { c.pc.close(); c.pc = null; }
  detachSpeaker(c);
  // A retry and the return-path toggle may both trigger a rebuild of the same connection. Last one wins:
  // each entry bumps a generation token, and an earlier run bails after any await once it sees it is stale --
  // no orphaned connections, and no stray retry scheduled in its catch on behalf of the newer one.
  const gen = c.gen = (c.gen || 0) + 1;
  const stale = () => c.gen !== gen || !live;

  const h = hostOf(c.target);
  try {
    setConnState(c, t('establishing'), 'warn');
    dlog(h, `--- connecting (attempt ${c.retry + 1})`);
    const cfg = await loadICE(c.target);
    if (stale()) return;
    if (cfg.name) { c.name = cfg.name; }
    dlog(h, 'receiver', cfg.name ? `"${cfg.name}"` : '(no name)', '| ICE servers:', describeICE(cfg.iceServers));
    const pc = new RTCPeerConnection({ iceServers: cfg.iceServers });
    c.pc = pc;
    c.camDeclined = false;
    // Debug log: everything this connection goes through. Listeners, not on* handlers, which the code below sets.
    let localCount = 0, mdns = false;
    pc.addEventListener('icecandidate', e => {
      if (c.pc !== pc) return;
      if (e.candidate && e.candidate.candidate) {
        localCount++;
        if (/\s[0-9a-f-]{36}\.local\s/i.test(e.candidate.candidate)) mdns = true;
        dlog(h, 'local candidate:', describeCandidate(e.candidate.candidate));
      } else {
        dlog(h, `local candidates: ${localCount}, done`);
        // Until the page has the microphone (or camera), the browser hides this device's addresses behind random .local
        // names, which the receiver must resolve over multicast DNS; networks that drop multicast leave them unusable.
        if (mdns) dlog(h, 'note: this device\'s addresses are hidden behind .local names (the browser does so until a microphone or camera is allowed)');
      }
    });
    pc.addEventListener('icecandidateerror', e => {
      if (c.pc !== pc) return;
      dlog(h, 'candidate error:', e.url || '', e.errorCode, e.errorText || '', e.address ? `(from ${e.address}:${e.port})` : '');
    });
    pc.addEventListener('icegatheringstatechange', () => { if (c.pc === pc) dlog(h, 'gathering:', pc.iceGatheringState); });
    pc.addEventListener('signalingstatechange', () => { if (c.pc === pc) dlog(h, 'signaling:', pc.signalingState); });
    pc.addEventListener('connectionstatechange', () => { if (c.pc === pc) dlog(h, 'connection:', pc.connectionState); });
    pc.addEventListener('iceconnectionstatechange', () => {
      if (c.pc !== pc) return;
      const s = pc.iceConnectionState;
      dlog(h, 'ICE:', s);
      // Failing or stalling: the candidate pairs say why; log them now, before a retry closes this connection.
      if (s === 'failed' || s === 'disconnected') pc.getStats().then(st => debugPairs(c, pc, st, true), () => {});
    });
    // Declare an audio transceiver up front to claim the m-line so ICE gathering starts right away; attachMic
    // fills in the real track once the mic is ready. On reconnect the mic is already in hand, so attach it now.
    // With the return path on, this m-line is sendrecv and the receiver sends the remote Mac's system audio back over it.
    const tx = pc.addTransceiver('audio', { direction: hear ? 'sendrecv' : 'sendonly' });
    if (stream) tx.sender.replaceTrack(stream.getAudioTracks()[0]);
    // The camera is a second m-line in the same offer, always sendonly: the receiver spots the return path by a=sendrecv,
    // so a sendrecv video line would be taken for one. The receiver decodes H.264 only, so it goes first in the codec
    // list; the full reordered list is passed (never a trimmed one) so a browser without H.264 still negotiates -- the
    // receiver then declines the line and the status line says why. No virtual camera on the Mac: same, declined.
    let vtx = null;
    if (cam) {
      vtx = pc.addTransceiver('video', { direction: 'sendonly', sendEncodings: [{ maxBitrate: 2_500_000, maxFramerate: 30 }] });
      if (camStream) vtx.sender.replaceTrack(camStream.getVideoTracks()[0]);
      const caps = RTCRtpSender.getCapabilities?.('video')?.codecs || [];
      const h264 = caps.filter(x => /video\/h264/i.test(x.mimeType));
      const rest = caps.filter(x => !/video\/h264/i.test(x.mimeType));
      if (h264.length && vtx.setCodecPreferences) {
        try { vtx.setCodecPreferences([...h264, ...rest]); } catch { /* default order: the receiver only answers H.264 anyway */ }
      }
    }
    pc.ontrack = e => {
      // Only the return-path audio ever comes back; the video line is sendonly, but never let a stray track become a player.
      if (c.pc !== pc || e.track.kind !== 'audio') return;
      detachSpeaker(c);
      const el = document.createElement('audio');
      el.autoplay = true;
      el.playsInline = true;
      el.srcObject = new MediaStream([e.track]);
      document.body.appendChild(el);
      el.play().catch(() => { /* a user gesture already happened, so this is rarely blocked */ });
      c.speaker = el;
      renderConns();
    };
    pc.oniceconnectionstatechange = () => {
      if (c.pc !== pc) return;
      const s = pc.iceConnectionState;
      if (s === 'connected' || s === 'completed') {
        clearTimeout(c.healTimer); c.healTimer = null;
        c.retry = 0;
        c.needCert = false;
        setConnState(c, t('connected'), 'ok');
      } else if (s === 'checking') {
        setConnState(c, t('connecting'), 'warn');
      } else if (s === 'disconnected') {
        // 'disconnected' only means "no packets from the peer for now"; ICE retries on its own and usually recovers.
        setConnState(c, t('hiccup'), 'warn');
        if (!c.healTimer) {
          c.healTimer = setTimeout(() => {
            c.healTimer = null;
            const now = c.pc && c.pc.iceConnectionState;
            if (now !== 'connected' && now !== 'completed') scheduleRetry(c, t('not_recovered'));
          }, 8000);
        }
      } else if (s === 'failed' || s === 'closed') {
        clearTimeout(c.healTimer); c.healTimer = null;
        scheduleRetry(c, s === 'failed' ? t('failed') : t('closed'));
      }
    };

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    if (vtx) { noH264 = !/ H264\//.test(offer.sdp); renderCamState(); }
    if (vtx && noH264) dlog(h, 'this browser offers no H.264: the camera cannot be relayed');
    // Wait for candidate gathering, but at most 3 s: when STUN is unreachable, don't sit through the browser's full 10 s.
    await new Promise(done => {
      if (pc.iceGatheringState === 'complete') return done();
      const cap = setTimeout(() => { dlog(h, 'gathering not complete after 3 s: sending the candidates found so far'); done(); }, 3000);
      pc.onicegatheringstatechange = () => {
        if (pc.iceGatheringState === 'complete') { clearTimeout(cap); done(); }
      };
    });
    if (stale()) { pc.close(); return; }

    setConnState(c, t('negotiating'), 'warn');
    const sent = (pc.localDescription.sdp.match(/^a=candidate:/gm) || []).length;
    dlog(h, `sending the offer (${sent} candidate${sent === 1 ? '' : 's'})`);
    const asked = performance.now();
    const res = await fetchWithin(15000, c.target + '/offer', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(pc.localDescription),
    });
    if (stale()) { pc.close(); return; }
    dlog(h, `offer answered: HTTP ${res.status} in ${Math.round(performance.now() - asked)} ms`);
    if (!res.ok) throw new Error(await res.text());
    const answer = await res.json();
    const theirs = String(answer.sdp || '').split(/\r?\n/).filter(l => l.startsWith('a=candidate:'));
    for (const l of theirs) dlog(h, 'receiver candidate:', describeCandidate(l));
    if (!theirs.length) dlog(h, 'the receiver sent no candidates');
    await pc.setRemoteDescription(answer);
    if (stale()) { pc.close(); return; }
    // The receiver takes the camera line as recvonly; inactive means it has no virtual camera (or nothing it can
    // decode from this browser). The track stays attached to an idle line, so the row says so instead of the badge.
    if (vtx) { c.camDeclined = vtx.currentDirection !== 'sendonly'; renderConns(); }
    if (vtx) dlog(h, 'camera line:', vtx.currentDirection, c.camDeclined ? '(declined by the receiver)' : '');
    if (vtx) preferFramerate(vtx.sender);

    if (!statsTimer) statsTimer = setInterval(poll, 1000);
  } catch (err) {
    if (stale()) return; // a stale attempt's failure doesn't count; don't schedule a retry on behalf of the newer one
    dlog(h, 'attempt failed:', err.name || '', err.message || String(err));
    // A cross-origin fetch blowing up (TypeError) on a target other than this receiver most likely means
    // its self-signed cert hasn't been accepted in this browser yet -- prompt to open it once; the retry picks it up.
    if (err instanceof TypeError && hostOf(c.target) !== location.hostname) {
      c.needCert = true;
    }
    scheduleRetry(c, err.message);
  }
}

// detachSpeaker stops and removes a connection's return-path playback.
function detachSpeaker(c) {
  if (!c.speaker) return;
  c.speaker.srcObject = null;
  c.speaker.remove();
  c.speaker = null;
}

// preferFramerate asks the encoder to give up resolution before frames under pressure: a face at 30 fps and 480p reads
// better than a crisp slideshow. Not every browser exposes the knob, and nothing depends on it.
function preferFramerate(sender) {
  try {
    const p = sender.getParameters();
    p.degradationPreference = 'maintain-framerate';
    sender.setParameters(p).catch(() => { /* optional */ });
  } catch { /* optional */ }
}

function scheduleRetry(c, why) {
  if (!live || c.retryTimer) return;
  const delay = Math.min(1000 * 2 ** c.retry, 15000);
  c.retry++;
  dlog(hostOf(c.target), `retrying in ${Math.round(delay / 1000)} s: ${why}`);
  setConnState(c, t('retry', { why, s: Math.round(delay / 1000) }), 'warn');
  c.retryTimer = setTimeout(() => { c.retryTimer = null; connectOne(c); }, delay);
}

function stop() {
  if (live) dlog('stop');
  live = false;
  clearInterval(discoverTimer); discoverTimer = null;
  clearInterval(statsTimer); statsTimer = null;
  cancelAnimationFrame(rafId); rafId = null;
  if (audioCtx) { audioCtx.close(); audioCtx = null; }
  for (const c of conns.values()) {
    clearTimeout(c.retryTimer);
    clearTimeout(c.healTimer);
    if (c.pc) c.pc.close();
    detachSpeaker(c);
  }
  conns.clear();
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  releaseCam();
  $('toggle').textContent = t('start');
  $('toggle').classList.remove('live');
  $('level').style.width = '0';
  $('micstate').textContent = '';
  renderConns();
}

function setConnState(c, text, cls) {
  c.state = text;
  c.cls = cls || '';
  renderConns();
}

// sendingVideo says whether a connection currently carries the camera: its video sender has a track and the
// receiver took the line (declined, the track sits on an inactive line and nothing goes out).
function sendingVideo(c) {
  return !!(c.pc && !c.camDeclined && senderOf(c.pc, 'video')?.track);
}

function renderConns() {
  const box = $('conns');
  if (conns.size === 0) {
    box.innerHTML = `<div class="empty">${t('not_connected')}</div>`;
    return;
  }
  box.innerHTML = [...conns.values()].map(c => `
    <div class="conn">
      <span class="host">${c.name ? c.name + ' · ' : ''}${hostOf(c.target)}${c.speaker ? ` <span title="${t('playing')}">🔊</span>` : ''}${sendingVideo(c) ? ` <span title="${t('sending_video')}">📷</span>` : ''}</span>
      <span class="st ${c.cls}">${c.needCert
        ? `${t('cert_before')}<a href="${c.target}" target="_blank">${t('cert_link')}</a>${t('cert_after')}`
        : c.state}</span>
      ${c.video ? `<span class="vid">${c.video}</span>` : c.camDeclined ? `<span class="vid">${t('cam_declined')}</span>` : ''}
      <span class="rtt">${c.rtt}</span>
    </div>`).join('');
}

// withTimeout rejects after ms. A getUserMedia that answers later (the user found the permission prompt after the
// error was shown) would otherwise leave its camera or microphone running with nothing on the page able to stop it.
function withTimeout(promise, ms, message) {
  let late = false;
  promise.then(s => { if (late && s?.getTracks) s.getTracks().forEach(t => t.stop()); }, () => {});
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => { late = true; reject(new Error(message)); }, ms)),
  ]);
}

// Raw browser errors mean nothing to the user; translate them into "what to go fix".
function explainMicError(err) {
  const name = err.name || '';
  if (name === 'NotAllowedError') return t('mic_denied');
  if (name === 'NotFoundError') return t('mic_notfound');
  if (name === 'NotReadableError') return t('mic_busy');
  if (name === 'OverconstrainedError') return t('mic_constraints');
  return t('mic_other', { reason: err.message || name || t('unknown') });
}

function explainCamError(err) {
  const name = err.name || '';
  if (name === 'NotAllowedError') return t('cam_denied');
  if (name === 'NotFoundError') return t('cam_notfound');
  if (name === 'NotReadableError' || name === 'AbortError') return t('cam_busy'); // Chrome reports a busy camera as AbortError
  if (name === 'OverconstrainedError') return t('cam_constraints');
  return t('cam_other', { err: err.message || name || t('unknown') });
}

// Local level meter: confirm this side is actually capturing audio before suspecting the network.
function meter(stream) {
  audioCtx = new AudioContext();
  const analyser = audioCtx.createAnalyser();
  analyser.fftSize = 1024;
  audioCtx.createMediaStreamSource(stream).connect(analyser);
  const buf = new Float32Array(analyser.fftSize);
  (function tick() {
    analyser.getFloatTimeDomainData(buf);
    let sum = 0;
    for (const v of buf) sum += v * v;
    const rms = Math.sqrt(sum / buf.length);
    $('level').style.width = Math.min(100, rms * 300) + '%';
    rafId = requestAnimationFrame(tick);
  })();
}

// poll scans every connection's stats once a second and writes the RTT (and relay marker) into its row.
async function poll() {
  let dirty = false;
  for (const c of conns.values()) {
    if (!c.pc || c.pc.connectionState === 'closed') continue;
    const pc = c.pc;
    const stats = await pc.getStats();
    if (c.pc === pc) debugPairs(c, pc, stats, false);
    let pair = null, video = null;
    stats.forEach(r => {
      if (r.type === 'candidate-pair' && r.state === 'succeeded' && r.nominated !== false) pair = r;
      if (r.type === 'outbound-rtp' && (r.kind || r.mediaType) === 'video') video = r;
    });
    if (pair && pair.currentRoundTripTime != null) {
      const local = stats.get(pair.localCandidateId);
      const rem = stats.get(pair.remoteCandidateId);
      const relayed = local?.candidateType === 'relay' || rem?.candidateType === 'relay';
      const txt = Math.round(pair.currentRoundTripTime * 1000) + 'ms' + (relayed ? ' ' + t('relay') : '');
      if (txt !== c.rtt) { c.rtt = txt; dirty = true; }
    }
    // Camera: the resolution and frame rate actually leaving this device, so "no picture on the Mac" splits into
    // "not sending" and "not arriving". Firefox lacks framesPerSecond; there, count framesSent between polls.
    let vtxt = '';
    if (video && video.framesSent) {
      const fps = video.framesPerSecond ?? Math.max(0, video.framesSent - (c.framesSent ?? video.framesSent));
      vtxt = (video.frameHeight ? video.frameHeight + 'p · ' : '') + Math.round(fps) + ' fps';
    }
    c.framesSent = video ? video.framesSent : undefined;
    if (vtxt !== c.video) { c.video = vtxt; dirty = true; }
  }
  if (dirty) renderConns();
}

addEventListener('pagehide', stop);
</script>
</body>
</html>
