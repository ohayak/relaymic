    // the transport may choose the bundle policy (relay.js: one set of candidates for every line).
    const pc = new RTCPeerConnection({
      iceServers: cfg.iceServers,
      ...(cfg.iceTransportPolicy === 'relay' ? { iceTransportPolicy: 'relay' } : {}),
      ...(transport.bundlePolicy ? { bundlePolicy: transport.bundlePolicy } : {}),
    });
    c.pc = pc;
    transport.prepare(c, pc);
    c.camDeclined = false;
    c.returnDeclined = false;
    c.packetsSent = c.packetsReceived = c.framesSent = undefined;
    c.audioSent = false;
    c.video = '';
    // Debug log: everything this connection goes through. Listeners, not on* handlers, which the code below sets.
    let localCount = 0, mdns = false;
    pc.addEventListener('icecandidate', e => {
      if (c.pc !== pc) return;
      if (e.candidate && e.candidate.candidate) {
        localCount++;
        if (/\s[0-9a-f-]{36}\.local\s/i.test(e.candidate.candidate)) mdns = true;
        dlog(h, 'local candidate:', describeCandidate(e.candidate.candidate));
      } else {
        dlog(h, `local candidates: ${localCount}, done`);
        // Until the page has the microphone (or camera), the browser hides this device's addresses behind random .local
        // names, which the receiver must resolve over multicast DNS; networks that drop multicast leave them unusable.
        if (mdns) dlog(h, 'note: this device\'s addresses are hidden behind .local names (the browser does so until a microphone or camera is allowed)');
      }
    });
    pc.addEventListener('icecandidateerror', e => {
      if (c.pc !== pc) return;
      dlog(h, 'candidate error:', e.url || '', e.errorCode, e.errorText || '', e.address ? `(from ${e.address}:${e.port})` : '');
    });
    pc.addEventListener('icegatheringstatechange', () => { if (c.pc === pc) dlog(h, 'gathering:', pc.iceGatheringState); });
    pc.addEventListener('signalingstatechange', () => { if (c.pc === pc) dlog(h, 'signaling:', pc.signalingState); });
    pc.addEventListener('connectionstatechange', () => { if (c.pc === pc) dlog(h, 'connection:', pc.connectionState); });
    pc.addEventListener('iceconnectionstatechange', () => {
      if (c.pc !== pc) return;
      const s = pc.iceConnectionState;
      dlog(h, 'ICE:', s);
      // Failing or stalling: the candidate pairs say why; log them now, before a retry closes this connection.
      if (s === 'failed' || s === 'disconnected') pc.getStats().then(st => debugPairs(c, pc, st, true), () => {});
    });
    // The audio line is always sendrecv: this side sends the graph's track (silent until the mic is in, or while
    // muted), and the receiver sends back over it what Mac pages play into Remote Visio Speaker -- the return path,
    // which the speaker switch mutes here. A receiver that keeps it to itself (as it does for a page on the Mac) answers
    // recvonly. Declaring it up front claims the m-line, so ICE gathering starts right away.
    const tx = pc.addTransceiver('audio', { direction: 'sendrecv' });
    if (sendTrack) tx.sender.replaceTrack(sendTrack);
    // The camera is a second m-line in the same offer, always there and always sendonly (the receiver spots the return
    // path by a=sendrecv, so a sendrecv video line would be taken for one); the camera switch only puts a track on it
    // or takes it off. The receiver decodes H.264 only, so it goes first in the codec list; the full reordered list is
    // passed (never a trimmed one) so a browser without H.264 still negotiates -- the receiver then declines the line
    // and the status says why. No camera on the Mac: same, declined.
    const vtx = pc.addTransceiver('video', { direction: 'sendonly', sendEncodings: [{ maxBitrate: 2_500_000, maxFramerate: 30 }] });
    if (camStream) vtx.sender.replaceTrack(camStream.getVideoTracks()[0]);
    const caps = RTCRtpSender.getCapabilities?.('video')?.codecs || [];
    const h264 = caps.filter(x => /video\/h264/i.test(x.mimeType));
    const rest = caps.filter(x => !/video\/h264/i.test(x.mimeType));
    if (h264.length && vtx.setCodecPreferences) {
      try { vtx.setCodecPreferences([...h264, ...rest]); } catch { /* default order: the receiver only answers H.264 anyway */ }
    }
    pc.ontrack = e => {
      // Only the return-path audio ever comes back; the video line is sendonly, but never let a stray track become a player.
      if (c.pc !== pc || e.track.kind !== 'audio') return;
      detachSpeaker(c);
      const el = document.createElement('audio');
      el.autoplay = true;
      el.playsInline = true;
      el.muted = !spkOn;
      el.volume = spkVol / 100;
      c.speaker = el;
      renderConns();
      // The player goes to the chosen speaker before it gets any sound, so nothing plays on the wrong one first.
      routeSpeaker(c, el).then(() => {
        if (c.speaker !== el) return; // replaced or taken down meanwhile
        const ms = new MediaStream([e.track]);
        el.srcObject = ms;
        document.body.appendChild(el);
        // A user gesture already happened, so this is rarely refused; when it is, the speaker's status says so and
        // the next tap or key plays it (wakeAudio).
        el.play().catch(err => { dlog(transport.tag(c), 'return path not playing:', err.name || '', err.message || ''); renderStatus(); });
        // The speaker's level meter reads the same stream. Chrome feeds a remote track to WebAudio only while a media
        // element plays it, which this one does (muted or not).
        if (audioCtx) {
          c.spkSource = audioCtx.createMediaStreamSource(ms);
          c.spkAnalyser = audioCtx.createAnalyser();
          c.spkAnalyser.fftSize = 1024;
          c.spkSource.connect(c.spkAnalyser);
        }
      });
    };
    pc.oniceconnectionstatechange = () => {
      if (c.pc !== pc) return;
      const s = pc.iceConnectionState;
      if (s === 'connected' || s === 'completed') {
        clearTimeout(c.healTimer); c.healTimer = null;
        c.retry = 0;
        c.needCert = false;
        setConnState(c, t('connected'), 'ok');
      } else if (s === 'checking') {
        setConnState(c, t('connecting'), 'warn');
      } else if (s === 'disconnected') {
        // 'disconnected' only means "no packets from the peer for now"; ICE retries on its own and usually recovers.
        setConnState(c, t('hiccup'), 'warn');
        // The transport may know better (relay mode asks the relay whether the computer is still the one this
        // connection reached: one that restarted cannot heal it, and the next attempt then starts at once).
        if (transport.hiccup) transport.hiccup(c);
        if (!c.healTimer) {
          c.healTimer = setTimeout(() => {
            c.healTimer = null;
            const now = c.pc && c.pc.iceConnectionState;
            if (now !== 'connected' && now !== 'completed') scheduleRetry(c, t('not_recovered'));
          }, 8000);
        }
      } else if (s === 'failed' || s === 'closed') {
        clearTimeout(c.healTimer); c.healTimer = null;
        scheduleRetry(c, s === 'failed' ? t('failed') : t('closed'));
      }
    };

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    noH264 = transport.needsH264 && !/ H264\//.test(offer.sdp);
    if (noH264) dlog(h, 'this browser offers no H.264: the camera cannot be relayed');
    // The offer goes to the other side, whole (receiver mode, after gathering) or at once with its candidates
    // trickling after it (relay mode), and its answer comes back.
    const answer = await transport.exchange(c, pc, gen);
    if (stale()) { pc.close(); return; }
    await pc.setRemoteDescription(answer);
    if (stale()) { pc.close(); return; }
    // The receiver takes the camera line as recvonly; inactive means it has no virtual camera (or nothing it can
    // decode from this browser). A track on that line goes nowhere, so the status says so. Likewise the audio line
    // answered recvonly: no return path from that receiver.
    c.camDeclined = vtx.currentDirection !== 'sendonly';
    c.returnDeclined = tx.currentDirection !== 'sendrecv';
    dlog(h, 'audio line:', tx.currentDirection, c.returnDeclined ? '(no return path from this receiver)' : '(with the return path)');
    dlog(h, 'camera line:', vtx.currentDirection, c.camDeclined ? '(declined by the receiver)' : '');
    preferFramerate(vtx.sender);
    renderConns();
    renderStatus();
  } catch (err) {
    if (stale()) return; // a stale attempt's failure doesn't count; don't schedule a retry on behalf of the newer one
    dlog(h, 'attempt failed:', err.name || '', err.message || String(err));
    // A cross-origin fetch blowing up (TypeError) on a target other than this receiver most likely means
    // its self-signed cert hasn't been accepted in this browser yet -- prompt to open it once; the retry picks it up.
    if (transport.certHint && err instanceof TypeError && !transport.isMain(c)) {
      c.needCert = true;
    }
    scheduleRetry(c, err.message);
  }
}

// detachSpeaker stops and removes a connection's return-path playback and its level meter's tap.
function detachSpeaker(c) {
  if (c.spkSource) { c.spkSource.disconnect(); c.spkSource = c.spkAnalyser = null; }
  c.spkRms = 0;
  if (!c.speaker) return;
  c.speaker.srcObject = null;
  c.speaker.remove();
  c.speaker = null;
}

// preferFramerate asks the encoder to give up resolution before frames under pressure: a face at 30 fps and 480p reads
// better than a crisp slideshow. Not every browser exposes the knob, and nothing depends on it.
function preferFramerate(sender) {
  try {
    const p = sender.getParameters();
    p.degradationPreference = 'maintain-framerate';
    sender.setParameters(p).catch(() => { /* optional */ });
  } catch { /* optional */ }
}

function scheduleRetry(c, why) {
  if (!live || c.retryTimer || conns.get(c.target.key) !== c) return;
  // Held by the transport (relay mode: the computer declined the connection, or another device took it over): no
  // retry until the user acts; the row says why.
  if (c.hold) {
    dlog(transport.tag(c), 'not retrying:', why);
    setConnState(c, c.hold, 'err');
    return;
  }
  // Relay mode spreads its retries (transport.jitter: ±20 %), so that the senders a relay outage cut off together do
  // not all come back at the same moment.
  const delay = Math.min(1000 * 2 ** c.retry, 15000) * (1 + (Math.random() * 2 - 1) * (transport.jitter || 0));
  c.retry++;
  c.lastWhy = why; // for the device statuses, which say the connection is down and why
  dlog(transport.tag(c), `retrying in ${Math.round(delay / 1000)} s: ${why}`);
  setConnState(c, t('retry', { why, s: Math.round(delay / 1000) }), 'warn');
  c.retryTimer = setTimeout(() => { c.retryTimer = null; connectOne(c); }, delay);
}

function stop() {
  if (live) dlog('stop');
  live = false;
  session++;
  clearInterval(discoverTimer); discoverTimer = null;
  clearInterval(statsTimer); statsTimer = null;
  clearInterval(statusTimer); statusTimer = null;
  cancelAnimationFrame(rafId); rafId = null;
  for (const c of conns.values()) {
    // An attempt still awaiting the receiver (its ICE configuration, the offer) has no pc to close yet: a new
    // generation makes it stale, so it gives up at its next step instead of connecting, after a quick Start, beside
    // the new session's.
    c.gen = (c.gen || 0) + 1;
    clearTimeout(c.retryTimer);
    clearTimeout(c.healTimer);
    transport.close(c, 'stop');
    if (c.pc) c.pc.close();
    detachSpeaker(c);
  }
  conns.clear();
  transport.stop();
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  closeAudio();
  releaseCam();
  micProblem = null; micWaiting = false; micNote = '';
  camWaiting = false;
  recvStatus = null; recvMicMiss = 0;
  $('toggle').textContent = t('start');
  $('toggle').classList.remove('live');
  showLevel('mic', 0);
  showLevel('spk', 0);
  renderConns();
  renderStatus();
}

function setConnState(c, text, cls) {
  c.state = text;
  c.cls = cls || '';
  renderConns();
  renderStatus();
}

// sendingVideo says whether a connection currently carries the camera: its video sender has a track and the
// receiver took the line (declined, the track sits on an inactive line and nothing goes out).
function sendingVideo(c) {
  return !!(c.pc && !c.camDeclined && senderOf(c.pc, 'video')?.track);
}

// renderConns draws one row per connection: its name (and the icons of what goes over it), the round trip, its state
// and the camera's picture. Built element by element and filled with textContent only: a name comes from the other
// side (the receiver's /ice-config, a paired computer), and a state can carry a message from it, so none of it may
// ever be read as markup -- even with scripts blocked, injected markup could navigate the page away.
function renderConns() {
  const box = $('conns');
  if (conns.size === 0) {
    box.replaceChildren(make('div', 'empty', t('not_connected')));
    return;
  }
  box.replaceChildren(...[...conns.values()].map(c => {
    const host = make('span', 'host', transport.label(c));
    if (c.speaker && spkOn) host.append(' ', make('span', '', '🔊', { title: t('playing') }));
    if (sendingVideo(c)) host.append(' ', make('span', '', '📷', { title: t('sending_video') }));
    const state = make('span', c.cls ? 'st ' + c.cls : 'st');
    if (c.needCert && transport.certHint) {
      // The certificate's page is the target itself; only ever an https: one (the receiver's own address).
      const a = make('a', '', t('cert_link'), { target: '_blank', rel: 'noopener' });
      if (/^https:/.test(c.target.key)) a.href = c.target.key;
      state.append(t('cert_before'), a, t('cert_after'));
    } else {
      state.textContent = c.state;
    }
    const line = make('div', 'connst', state);
    if (c.video) line.append(' · ', make('span', 'vid', c.video));
    else if (c.camDeclined && camOn) line.append(' · ', make('span', 'vid note', t('cam_declined')));
    const row = make('div', 'conn', make('div', 'connhead', host, make('span', 'rtt', c.rtt)), line);
    if (c.actions && c.actions.length) {
      row.append(make('div', 'connact', ...c.actions.map(x => {
        const b = make('button', 'btn', x.text, { type: 'button' });
        b.onclick = x.run;
        return b;
      })));
    }
    return row;
  }));
}

// make makes an element of a class, with children (text, as text nodes, or elements) and attributes. Text is never
// parsed as markup.
function make(tag, cls, ...rest) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  for (const x of rest) {
    if (x instanceof Node || typeof x === 'string') e.append(x);
    else if (x && typeof x === 'object') for (const [k, v] of Object.entries(x)) e.setAttribute(k, v);
  }
  return e;
}

// withTimeout rejects after ms. A getUserMedia that answers later (the user found the permission prompt after the
// error was shown) would otherwise leave its camera or microphone running with nothing on the page able to stop it.
function withTimeout(promise, ms, message) {
  let late = false;
  promise.then(s => { if (late && s?.getTracks) s.getTracks().forEach(t => t.stop()); }, () => {});
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => { late = true; reject(new Error(message)); }, ms)),
  ]);
}

// Raw browser errors mean nothing to the user; translate them into "what to go fix".
function explainMicError(err) {
  const name = err.name || '';
  if (name === 'NotAllowedError') return t('mic_denied');
  if (name === 'NotFoundError') return t('mic_notfound');
  if (name === 'NotReadableError') return t('mic_busy');
  if (name === 'OverconstrainedError') return t('mic_constraints');
  return t('mic_other', { reason: err.message || name || t('unknown') });
}

function explainCamError(err) {
  const name = err.name || '';
  if (name === 'NotAllowedError') return t('cam_denied');
  if (name === 'NotFoundError') return t('cam_notfound');
  if (name === 'NotReadableError' || name === 'AbortError') return t('cam_busy'); // Chrome reports a busy camera as AbortError
  if (name === 'OverconstrainedError') return t('cam_constraints');
  return t('cam_other', { err: err.message || name || t('unknown') });
}

// micProblemOf and camProblemOf turn a failure to open the device into its status: a short state for the status line
// (key, for the debug log; text) and the explanation under it (detail).
function micProblemOf(err) {
  const name = err.name || '';
  const [key, text] = name === 'NotAllowedError' ? ['denied', t('st_no_permission')]
    : name === 'NotFoundError' ? ['none', t('mic_none')]
    : name === 'NotReadableError' ? ['busy', t('st_busy')]
    : ['error', t('st_error')];
  // "No microphone" needs no explanation, but what to do about it.
  return { key, text, detail: key === 'none' ? t('mic_none_hint') : explainMicError(err) };
}

function camProblemOf(err) {
  const name = err.name || '';
  const [key, text] = name === 'NotAllowedError' ? ['denied', t('st_no_permission')]
    : name === 'NotFoundError' ? ['none', t('cam_none')]
    : name === 'NotReadableError' || name === 'AbortError' ? ['busy', t('st_busy')]
    : ['error', t('st_error')];
  return { key, text, detail: key === 'none' ? t('cam_none_hint') : explainCamError(err) };
}

// ---- Levels ----

// The meters: the microphone's after the volume (what the Mac gets; greyed while muted), the speaker's from the return
// path as it arrives (greyed while the speaker is off). A level is the signal's RMS on a 60 dB scale, which is how loud
// it sounds rather than how big it is. The microphone switch also shows it, as a ring, and the tile as Meet's three
// bars. With reduced motion asked for, the meters move in steps a few times a second and the ring only says "sound or not".
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
const levelBuf = new Float32Array(1024);
let levelsAt = 0, ringOn = false;

function rmsOf(analyser) {
  analyser.getFloatTimeDomainData(levelBuf);
  let sum = 0;
  for (const v of levelBuf) sum += v * v;
  return Math.sqrt(sum / levelBuf.length);
}

function levelOf(rms) {
  if (rms <= 0.001) return 0; // below -60 dBFS
  return Math.min(1, Math.max(0, (20 * Math.log10(rms) + 60) / 60));
}

// showLevel draws one meter. Its data-level (0-100) is there for tests and its aria-valuenow for assistive technology.
function showLevel(kind, v) {
  const el = $(kind + '-level');
  el.style.setProperty('--lvl', v.toFixed(3));
  const pct = String(Math.round(v * 100));
  if (el.dataset.level !== pct) { el.dataset.level = pct; el.setAttribute('aria-valuenow', pct); }
}

function tickLevels() {
  cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(tickLevels);
  const now = performance.now();
  if (reducedMotion.matches && now - levelsAt < 250) return;
  levelsAt = now;
  // A suspended graph leaves the analysers on their last buffer: no reading then, rather than a frozen one.
  const running = audioRunning();
  const mic = running && micAnalyser && stream ? levelOf(rmsOf(micAnalyser)) : 0;
  let spk = 0;
  for (const c of conns.values()) {
    c.spkRms = running && c.spkAnalyser ? rmsOf(c.spkAnalyser) : 0;
    spk = Math.max(spk, levelOf(c.spkRms));
  }
  showLevel('mic', mic);
  showLevel('spk', spk);
  const speaking = micOn ? mic : 0;
  if (reducedMotion.matches) {
    ringOn = ringOn ? speaking > 0.25 : speaking > 0.35; // a little hysteresis, so it doesn't flicker
    $('mic-toggle').style.setProperty('--lvl', ringOn ? '0.6' : '0');
  } else {
    $('mic-toggle').style.setProperty('--lvl', speaking.toFixed(3));
  }
  $('mic-bars').style.setProperty('--lvl', speaking.toFixed(3));
}

// ---- Status ----

// The receiver's own view, from GET /api/status on the receiver that served this page (relay mode: the "status"
// messages of the selected computer): which pages there use its microphone, speaker and camera ("browser"), and its
// system camera ("camera"). Polled every few seconds while live. An older receiver has fewer fields, or no such
// endpoint: the statuses then say only what this side can see.
let recvStatus = null, recvStatusOk = null, recvMicMiss = 0;
async function fetchStatus() {
  if (!live) return;
  const got = await transport.status(mainConn());
  if (!live) return;
  const ok = !!got;
  recvStatus = got || null;
  // The receiver says whether the microphone's packets reached it lately (an older one does not say). Packets leaving
  // here that do not arrive there, two polls running, is a status of its own: a single one may just be the first.
  const m = recvStatus?.browser?.microphone;
  recvMicMiss = m && m.audio === false && mainConn()?.audioSent ? recvMicMiss + 1 : 0;
  if (ok !== recvStatusOk) { recvStatusOk = ok; dlog('receiver status:', ok ? 'available' : 'not available (the statuses say only what this page sees)'); }
  renderStatus();
}

// isUp tells whether a connection's ICE is through.
function isUp(c) {
  const s = c && c.pc && c.pc.iceConnectionState;
  return s === 'connected' || s === 'completed';
}

// countText says how many pages use a device, or names them when the receiver did (only to a page on the Mac).
function countText(key, n, pages, vars = {}) {
  if (Array.isArray(pages) && pages.length) return t(key + '_by', { ...vars, pages: pages.map(p => String(p).replace(/^https?:\/\//, '')).join(', ') });
  return t(key + (n === 1 ? '_one' : '_other'), { ...vars, n });
}

// A device's status: state (ok green, wait amber, bad red, off grey), key (what kind of status, for the debug log,
// which notes changes of kind and not every new frame rate), text, and detail (the explanation under it, if any).
const st = (state, key, text, detail = '') => ({ state, key, text, detail });

// connStatus is a device's status while the connection it goes over is not up (null once it is): connecting the first
// time, a network hiccup it may recover from, or -- after an attempt failed -- red "Not connected", with the last
// reason under it (the connection retries on its own).
function connStatus(c) {
  if (isUp(c)) return null;
  if (c && c.hold) return st('bad', 'held', t('not_connected'), c.hold);
  if (c && c.retry > 0) return st('bad', 'notconnected', t('not_connected'), t('last_try', { why: c.lastWhy || t('failed') }));
  if (c && c.pc && c.pc.iceConnectionState === 'disconnected') return st('wait', 'hiccup', t('hiccup'));
  return st('wait', 'connecting', t('connecting'));
}

function micStatus() {
  if (live && micOn && micProblem) return st('bad', micProblem.key, micProblem.text, micProblem.detail);
  if (!micOn) return st('off', 'off', t('st_off'));
  if (!live) return st('off', 'ready', t('st_ready'));
  if (micWaiting) return st('wait', 'permission', t('st_waiting_perm'), t('mic_waiting'));
  if (!stream) return st('wait', 'starting', t('st_starting'));
  if (!audioRunning()) return st('wait', 'paused', t('mic_paused'), t('tap_resume'));
  const c = mainConn();
  const down = connStatus(c);
  if (down) return { ...down, detail: micNote || down.detail };
  const note = micNote || (micGain === 0 ? t('vol_zero') : '');
  if (!c.audioSent) return st('wait', 'nosound', t('mic_nosound'), note);
  const m = recvStatus?.browser?.microphone;
  if (!m || typeof m.listeners !== 'number') return st('ok', 'sending', t('mic_sending'), note);
  if (m.on === false) return st('wait', 'unavailable', t('mic_unavailable'), note);
  if (recvMicMiss >= 2) return st('wait', 'notarriving', t('mic_notarriving'), note);
  if (m.listeners > 0) return st('ok', 'used', countText('mic_used', m.listeners, m.pages), note);
  return st('wait', 'unused', t('mic_unused'), note);
}

function spkStatus() {
  if (!spkOn) return st('off', 'off', t('st_off'));
  if (!live) return st('off', 'ready', t('st_ready'));
  const c = mainConn();
  const down = connStatus(c);
  if (down) return down;
  if (c.returnDeclined) return st('bad', 'declined', t('spk_declined'));
  const note = spkVol === 0 && canSetVolume ? t('vol_zero') : '';
  if (c.spkHeardAt && Date.now() - c.spkHeardAt < 3000) {
    // Sound arrives, but a player the browser would not start (autoplay rules) plays none of it.
    if (c.speaker && c.speaker.srcObject && c.speaker.paused) return st('wait', 'blocked', t('spk_blocked'), t('tap_play'));
    return st('ok', 'playing', t('spk_playing'), note);
  }
  const s = recvStatus?.browser?.speaker;
  if (s && typeof s.sources === 'number' && s.sources === 0) return st('wait', 'unused', t('spk_unused'), note);
  return st('wait', 'silent', t('spk_silent'), note);
}

function camStatus() {
  if (live && camOn && camProblem) return st('bad', camProblem.key, camProblem.text, camProblem.detail);
  if (!camOn) return st('off', 'off', t('st_off'));
  if (!live) return noCam ? st('bad', 'none', t('cam_none'), t('cam_none_hint')) : st('off', 'ready', t('st_ready'));
  if (camWaiting) return st('wait', 'permission', t('st_waiting_perm'), t('cam_waiting'));
  if (!camStream) return noCam ? st('bad', 'none', t('cam_none'), t('cam_none_hint')) : st('wait', 'starting', t('st_starting'));
  const c = mainConn();
  const down = connStatus(c);
  if (down) return { ...down, detail: camNote || down.detail };
  if (noH264) return st('bad', 'noh264', t('cam_noh264_short'), t('cam_noh264'));
  if (c.camDeclined) return st('bad', 'declined', t('cam_declined'), camNote);
  if (!c.video) return st('wait', 'nopicture', t('cam_nopicture'), camNote);
  const b = recvStatus?.browser;
  if (!b || typeof b.viewers !== 'number') return st('ok', 'sending', t('cam_sending', { video: c.video }), camNote);
  if (b.viewers > 0) return st('ok', 'shown', countText('cam_shown', b.viewers, b.pages, { video: c.video }), camNote);
  // The system camera (the Mac's virtual camera) does not say who watches it: when it is there, sending is all we know.
  if (recvStatus.camera?.available) return st('ok', 'sending', t('cam_sending', { video: c.video }), camNote);
  return st('wait', 'unused', t('cam_unused'), camNote);
}

// renderStatus writes the three statuses (only what changed), redraws the switches (a red status is their "problem"
// look), and logs each change of kind. A change of kind is also announced to screen readers (#announce, polite), once:
// not every new frame rate, and not the first statuses, which are simply there to be read.
const lastStatus = {}, statusNow = {};
const DEVICE_NAMES = { mic: 'mic', spk: 'speaker', cam: 'camera' };
function renderStatus() {
  const said = [];
  for (const [kind, s] of [['mic', micStatus()], ['spk', spkStatus()], ['cam', camStatus()]]) {
    statusNow[kind] = s;
    const el = $(kind + '-status'), detail = $(kind + '-detail');
    if (el.dataset.state !== s.state) el.dataset.state = s.state;
    const text = el.querySelector('.st-text');
    if (text.textContent !== s.text) text.textContent = s.text;
    if (detail.textContent !== s.detail) detail.textContent = s.detail;
    detail.hidden = !s.detail;
    const sig = s.state + ' ' + s.key;
    if (lastStatus[kind] !== sig) {
      if (lastStatus[kind] !== undefined) said.push(t('announce', { device: t(DEVICE_NAMES[kind]), status: s.text }));
      lastStatus[kind] = sig;
      dlog('status', kind + ':', s.state, '-', s.text);
    }
  }
  if (said.length) $('announce').textContent = said.join('. ');
  renderToggles();
  $('mic-bars').hidden = !(live && stream);
}

// renderTile shows the camera, or what stands in for it: off, not started yet, or why there is no picture.
function renderTile() {
  const showing = !!camStream;
  $('campreview').hidden = !showing;
  $('camoff').hidden = showing;
  if (showing) return;
  const s = camStatus();
  const text = !camOn ? t('cam_is_off')
    : !live ? (noCam ? t('cam_none') : t('tile_ready'))
    : s.state === 'bad' ? s.text
    : s.state === 'wait' ? s.text
    : t('cam_is_off');
  $('camoff-text').textContent = text;
  $('camoff').querySelector('use').setAttribute('href', camOn && s.state !== 'bad' ? '#i-cam' : '#i-cam-off');
}

// poll scans every connection's stats once a second: the RTT (and relay marker) and the camera's resolution and frame
// rate for its row, and for the statuses whether audio leaves, whether the return path brings sound, and the camera.
async function poll() {
  let dirty = false;
  for (const c of conns.values()) {
    if (!c.pc || c.pc.connectionState === 'closed') continue;
    const pc = c.pc;
    const stats = await pc.getStats();
    if (c.pc !== pc) continue;
    debugPairs(c, pc, stats, false);
    let pair = null, video = null, aout = null, ain = null;
    stats.forEach(r => {
      if (r.type === 'candidate-pair' && r.state === 'succeeded' && r.nominated !== false) pair = r;
      const kind = r.kind || r.mediaType;
      if (r.type === 'outbound-rtp' && kind === 'video') video = r;
      if (r.type === 'outbound-rtp' && kind === 'audio') aout = r;
      if (r.type === 'inbound-rtp' && kind === 'audio') ain = r;
    });
    if (pair && pair.currentRoundTripTime != null) {
      const local = stats.get(pair.localCandidateId);
      const rem = stats.get(pair.remoteCandidateId);
      const relayed = local?.candidateType === 'relay' || rem?.candidateType === 'relay';
      const txt = Math.round(pair.currentRoundTripTime * 1000) + 'ms' + (relayed ? ' ' + t('relay') : '');
      if (txt !== c.rtt) { c.rtt = txt; dirty = true; }
    }
    // Audio out: packets leaving since the last look (a muted microphone still sends, silence).
    const sentNow = aout ? aout.packetsSent || 0 : 0;
    c.audioSent = c.packetsSent !== undefined && sentNow > c.packetsSent;
    c.packetsSent = sentNow;
    // Return path: packets arriving with sound in them (the receiver's audioLevel, or the meter's own reading).
    const gotNow = ain ? ain.packetsReceived || 0 : 0;
    if (c.packetsReceived !== undefined && gotNow > c.packetsReceived && ((ain.audioLevel ?? 0) > 0.003 || (c.spkRms || 0) > 0.003)) {
      c.spkHeardAt = Date.now();
    }
    c.packetsReceived = gotNow;
    // Camera: the resolution and frame rate actually leaving this device, so "no picture on the Mac" splits into
    // "not sending" and "not arriving". Firefox lacks framesPerSecond; there, count framesSent between polls.
    let vtxt = '';
    if (video && video.framesSent && senderOf(pc, 'video')?.track) {
      const fps = video.framesPerSecond ?? Math.max(0, video.framesSent - (c.framesSent ?? video.framesSent));
      vtxt = (video.frameHeight ? video.frameHeight + 'p · ' : '') + Math.round(fps) + ' fps';
    }
    c.framesSent = video ? video.framesSent : undefined;
    if (vtxt !== c.video) { c.video = vtxt; dirty = true; }
  }
  if (dirty) renderConns();
  renderStatus();
}

// ---- Relay mode ----

// What relay.js and pair-ui.js use of this page. They are modules, written against this and nothing else of the page.
const api = {
  dlog, t, renderConns, renderStatus, ensureConn, dropConn, endConn, connectOne, scheduleRetry, setConnState,
  applyDemand, isStale, describeCandidate, takeFragment, stop,
  isLive: () => live,
  conns: () => [...conns.values()],
  // The selected computer changed: while live, connect to it, and close the connection to the one before.
  retarget: () => discover(),
};

if (TRANSPORT === 'relay') {
  // Start waits for relay.js, which loads in a moment: it has the computer to send to.
  $('toggle').disabled = true;
  import('/send/relay.js')
    .then(m => {
      const relay = m.createRelayTransport(api);
      return relay.ready.then(() => {
        transport = relay;
        $('toggle').disabled = false;
      });
    })
    .catch(err => {
      dlog('relay mode did not load:', err.name || '', err.message || String(err));
      const hint = $('starthint');
      hint.textContent = t('relay_failed', { why: err.message || String(err) });
      hint.hidden = false;
    });
  // A pairing link opened in this tab while it shows the page changes only the fragment: take it out the same way.
  addEventListener('hashchange', () => { if (takeHash()) transport.linkArrived?.(); });
}

renderToggles();
renderVolumes();
renderTile();
renderStatus();
listDevices();

addEventListener('pagehide', stop);
</script>
</body>
