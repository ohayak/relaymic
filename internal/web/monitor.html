<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/favicon-96.png" sizes="96x96" type="image/png">
<link rel="apple-touch-icon" href="/favicon-96.png">
<title>Receiver Monitor</title>
<style>
  :root {
    --bg: #0f1115;
    --fg: #e8eaed;
    --dim: #8a8f98;
    --line: #262a33;
    --ok: #35c46b;
    --warn: #e0a034;
    --err: #e05a4f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.6 -apple-system, "Segoe UI", system-ui, sans-serif;
    padding: 24px;
  }
  main { width: 100%; max-width: 480px; margin: 0 auto; }
  h1 { font-size: 17px; font-weight: 600; margin: 0 0 20px; }

  .card {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .card h2 {
    font-size: 13px;
    font-weight: 600;
    color: var(--dim);
    margin: 0 0 12px;
  }

  #state { font-size: 15px; font-weight: 600; }
  #path { color: var(--dim); font-size: 13px; margin: 4px 0 16px; word-break: break-all; }

  .stats { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--dim); }
  .stats b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
  .stats.cam { margin-top: 14px; }

  .device { display: flex; gap: 12px; font-size: 13px; padding: 6px 0; border-top: 1px solid var(--line); }
  .device:first-of-type { border-top: 0; padding-top: 0; }
  .device .name { flex: 0 0 96px; color: var(--dim); }
  .device b { font-weight: 600; overflow-wrap: anywhere; }

  .ok { color: var(--ok); } .warn { color: var(--warn); } .err { color: var(--err); }
</style>
</head>
<body>
<main>
  <h1 data-i18n="title">Receiver Monitor</h1>

  <div class="card">
    <div id="state" class="warn">—</div>
    <div id="path">—</div>
    <div class="stats">
      <span><span data-i18n="received">Received</span> <b id="received">—</b></span>
      <span><span data-i18n="lost">Lost</span> <b id="lost">—</b></span>
    </div>
    <div class="stats cam"><span><span data-i18n="camera">Virtual camera</span> <b id="camera">—</b></span></div>
  </div>

  <div class="card">
    <h2 data-i18n="browser_devices">Browser devices (Remote Visio extension)</h2>
    <div class="device"><span class="name" data-i18n="browser_mic">Microphone</span> <b id="bmic">—</b></div>
    <div class="device"><span class="name" data-i18n="browser_speaker">Speaker</span> <b id="bspk">—</b></div>
    <div class="device"><span class="name" data-i18n="browser_camera">Camera</span> <b id="bcamera">—</b></div>
  </div>
</main>

<script src="/i18n.js"></script>
<script>
// Most receiver failures (process not running, LAN down) make fetch throw rather than return a non-200,
// so both cases collapse into "offline"; the user doesn't need to tell them apart.
async function pollStatus() {
  try {
    const res = await fetch('/api/status');
    if (!res.ok) throw new Error(String(res.status));
    renderStatus(await res.json());
  } catch {
    renderOffline();
  }
}

function renderStatus(s) {
  const connected = s.state === 'connected';
  $('state').textContent = s.state || '—';
  $('state').className = connected ? 'ok' : 'warn';
  $('path').textContent = s.path || '—';

  // The sender's microphone at the RTP layer: what arrived and what the network lost on the way.
  $('received').textContent = s.received ?? '—';
  $('lost').textContent = s.lost ?? '—';

  // Virtual camera: "off" is the relay switched off; "extension not activated" is the relay on but macOS refusing the
  // device (the camera extension needs a one-time approval in System Settings); "no video arriving" is the device open
  // but no frames decoded in the last second, i.e. the sender isn't sending its camera.
  const cam = s.camera || {};
  $('camera').textContent = !cam.on ? t('camera_off')
    : !cam.available ? t('camera_ext_missing')
    : !cam.fps ? t('camera_idle')
    : `${cam.width}×${cam.height} · ${cam.fps} fps${cam.hardware ? '' : ' · software'}`;

  renderBrowser(s.browser || {});
}

// site drops the scheme from a page's origin, for display.
const site = origin => origin.replace(/^https?:\/\//, '');

// usedBy is " · used by …" for the pages connected to a device, or nothing. Other machines get no origins
// (the receiver keeps them to itself), so the count stands in for them there.
function usedBy(pages, count) {
  const names = (pages || []).map(site).join(', ');
  return count ? ' · ' + t('used_by', { n: names || count }) : '';
}

// The browser extension's three devices, as the receiver serves them to the Mac's Chromium pages. One listener
// serves all three, so "unavailable" (it could not start) applies to each.
function renderBrowser(b) {
  const un = b.unavailable ? `${t('unavailable')}: ${b.unavailable}` : '';

  // Microphone: the sender's microphone, relayed to the pages listening.
  const m = b.microphone || {};
  $('bmic').textContent = un || (!m.on ? t('off')
    : (m.audio ? t('mic_receiving') : t('mic_waiting')) + usedBy(m.pages, m.listeners));

  // Speaker: what one page plays into it goes back to the sender, if the sender takes it.
  // (sources counts the pages connected to it; an older receiver has only their origins.)
  const sp = b.speaker || {};
  const spkPages = sp.pages || [];
  const spkCount = typeof sp.sources === 'number' ? sp.sources : spkPages.length;
  $('bspk').textContent = un || (!sp.on ? t('off')
    : !sp.listening ? t('spk_not_listening') + usedBy(spkPages, spkCount)
    : sp.sending ? (sp.page ? t('spk_sending', { page: site(sp.page) }) : t('spk_sending_anon'))
    : t('spk_idle') + usedBy(spkPages, spkCount));

  // Camera: the same camera as the virtual one, relayed to the pages watching.
  $('bcamera').textContent = un || (!b.on ? t('camera_off')
    : (!b.video ? t('bcam_idle') : `${b.fps} fps`) + usedBy(b.pages, b.viewers));
}

function renderOffline() {
  $('state').textContent = t('offline');
  $('state').className = 'err';
  $('path').textContent = '—';
  for (const id of ['received', 'lost', 'camera', 'bmic', 'bspk', 'bcamera']) $(id).textContent = '—';
}

pollStatus();
setInterval(pollStatus, 1000);
</script>
