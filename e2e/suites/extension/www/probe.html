<!doctype html><title>probe</title><body><script>
window.rms = (an) => { const a = new Float32Array(an.fftSize); an.getFloatTimeDomainData(a); let s = 0; for (const v of a) s += v * v; return Math.sqrt(s / a.length); };
window.peakFreq = (an, ctx) => { const a = new Float32Array(an.frequencyBinCount); an.getFloatFrequencyData(a); let m = -Infinity, k = 0; a.forEach((v, i) => { if (v > m) { m = v; k = i; } }); return Math.round(k * ctx.sampleRate / an.fftSize); };
window.loopback = async (track) => {
  const a = new RTCPeerConnection(), b = new RTCPeerConnection();
  a.onicecandidate = e => e.candidate && b.addIceCandidate(e.candidate);
  b.onicecandidate = e => e.candidate && a.addIceCandidate(e.candidate);
  a.addTrack(track);
  const got = new Promise(r => b.ontrack = e => r(e.track));
  await a.setLocalDescription(); await b.setRemoteDescription(a.localDescription);
  await b.setLocalDescription(); await a.setRemoteDescription(b.localDescription);
  return got;
};
window.procStats = async (track, ms = 1500) => {
  const reader = new MediaStreamTrackProcessor({ track }).readable.getReader();
  let n = 0, sum = 0, cnt = 0, fmt = null; const t0 = performance.now();
  const stop = setTimeout(() => reader.cancel(), ms);
  for (;;) { const r = await reader.read(); if (r.done) break; const d = r.value; n++; fmt = [d.format, d.sampleRate, d.numberOfChannels, d.numberOfFrames];
    const buf = new Float32Array(d.numberOfFrames); d.copyTo(buf, { planeIndex: 0, format: 'f32-planar' }); for (const v of buf) { sum += v * v; cnt++; } d.close(); }
  return { n, rms: Math.sqrt(sum / Math.max(1, cnt)), fmt };
};
</script></body>
