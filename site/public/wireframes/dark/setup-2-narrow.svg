<text x="48" y="396" font-size="21" class="rvw-tm">Add to Chrome, or Get in Edge</text>
<circle cx="30" cy="456" r="6" class="rvw-a3"/>
<text x="48" y="464" font-size="24" font-weight="600" class="rvw-t">Pin it to the toolbar</text>
<text x="48" y="494" font-size="21" class="rvw-tm">Its button stays in view</text>
<rect x="16" y="540" width="448" height="330" rx="14" class="rvw-cd rvw-l"/>
<use href="#rvs2nd-glyph" x="40" y="562" width="32" height="28" class="rvw-i" stroke-width="5.2"/>
<text x="84" y="584" font-size="20" font-weight="600" class="rvw-t">Remote Visio Camera</text>
<text x="40" y="636" font-size="24" font-weight="600" class="rvw-t">Allow meeting.example to use</text>
<text x="40" y="668" font-size="24" font-weight="600" class="rvw-t">Remote Visio's camera,</text>
<text x="40" y="700" font-size="24" font-weight="600" class="rvw-t">microphone and speaker?</text>
<path d="M40 732H420" class="rvw-bar"/>
<path d="M40 752H300" class="rvw-bar"/>
