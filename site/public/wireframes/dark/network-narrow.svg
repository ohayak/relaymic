<svg xmlns="http://www.w3.org/2000/svg" class="rvw" viewBox="0 0 720 1476" width="720" height="1476" role="img" aria-labelledby="rvnwnd-title rvnwnd-desc">
<title id="rvnwnd-title">How Remote Visio connects</title>
<desc id="rvnwnd-desc">Two ways to connect your device to the Mac. On the same local network, at home or in the office, your phone or laptop opens https://your-mac:7420 and connects to the Mac peer-to-peer, encrypted. Anywhere else, both devices join your Tailscale network, each with a 100.x address, and connect peer-to-peer inside it. Public STUN servers from Google, Cloudflare and Xiaomi only help each end find its public address: they see IP addresses, never sound or video. There is no Remote Visio server: no account, no relay of ours, nothing recorded. A TURN relay is used only if you set up your own, for networks that refuse a direct path.</desc>
<style>
:where(svg.rvw){--rvw-bg:#131417;--rvw-panel:#191a1f;--rvw-card:#202228;--rvw-ink:#eceae6;--rvw-muted:#a3a49d;--rvw-faint:#73757c;--rvw-accent:#ffb000;--rvw-soft:#3b2f12;--rvw-live:#57d08a;font-family:var(--rvw-font,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif)}
