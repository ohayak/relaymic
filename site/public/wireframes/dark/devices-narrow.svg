<svg xmlns="http://www.w3.org/2000/svg" class="rvw" viewBox="0 0 720 1816" width="720" height="1816" role="img" aria-labelledby="rvdvnd-title rvdvnd-desc">
<title id="rvdvnd-title">Remote Visio's three devices</title>
<desc id="rvdvnd-desc">Microphone: your device's microphone, with echo and noise handled on that device and not on the Mac, becomes Remote Visio Microphone on the remote Mac, passed on untouched, and the web meeting hears you. Speaker: the meeting's sound plays into Remote Visio Speaker, which carries it back while the Mac stays silent, and you hear it on your device's speakers or headphones. Camera: your device's camera becomes Remote Visio Camera, which the web meeting picks like any webcam; video apps can use it too through the optional virtual camera, where macOS allows it. Remote Visio Microphone and Speaker exist only in web pages of Chromium browsers (Chrome, Edge, Brave, Arc); the Zoom, Teams and FaceTime apps don't see them.</desc>
<style>
:where(svg.rvw){--rvw-bg:#131417;--rvw-panel:#191a1f;--rvw-card:#202228;--rvw-ink:#eceae6;--rvw-muted:#a3a49d;--rvw-faint:#73757c;--rvw-accent:#ffb000;--rvw-soft:#3b2f12;--rvw-live:#57d08a;font-family:var(--rvw-font,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif)}
.rvw-l,.rvw-l2,.rvw-lm,.rvw-la,.rvw-a3,.rvw-ds,.rvw-dt,.rvw-sep,.rvw-bar,.rvw-i,.rvw-ia,.rvw-im{fill:none;stroke-linecap:round;stroke-linejoin:round}
.rvw-l{stroke:var(--rvw-ink);stroke-width:3}
.rvw-l2{stroke:var(--rvw-ink);stroke-width:2}
.rvw-lm{stroke:var(--rvw-muted);stroke-width:2}
.rvw-la{stroke:var(--rvw-accent);stroke-width:4}
.rvw-a3{stroke:var(--rvw-accent);stroke-width:3}
.rvw-ds{stroke:var(--rvw-muted);stroke-width:2.5;stroke-dasharray:10 9}
.rvw-dt{stroke:var(--rvw-muted);stroke-width:3;stroke-dasharray:.5 9}
.rvw-sep{stroke:var(--rvw-faint);stroke-width:1.5}
.rvw-bar{stroke:var(--rvw-faint);stroke-width:7}
.rvw-i{stroke:var(--rvw-ink)}
.rvw-ia{stroke:var(--rvw-accent)}
.rvw-im{stroke:var(--rvw-muted)}
.rvw-bg{fill:var(--rvw-bg)}
.rvw-pn{fill:var(--rvw-panel)}
.rvw-cd{fill:var(--rvw-card)}
.rvw-sf{fill:var(--rvw-soft)}
.rvw-ik{fill:var(--rvw-ink)}
.rvw-lv{fill:var(--rvw-live)}
.rvw-t{fill:var(--rvw-ink)}
.rvw-tm{fill:var(--rvw-muted)}
.rvw-ta{fill:var(--rvw-accent)}
.rvw-tc{fill:var(--rvw-card)}
.rvw-mono{font-family:var(--rvw-mono,ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace)}
</style>
<defs><symbol id="rvdvnd-cam" viewBox="0 0 24 24"><rect x="2.5" y="6.5" width="13" height="11" rx="2"/><path d="M15.5 10.5 21.5 7v10l-6-3.5"/></symbol><symbol id="rvdvnd-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/></symbol><symbol id="rvdvnd-spk" viewBox="0 0 24 24"><path d="M3.5 9.5H7L11.5 5.5v13L7 14.5H3.5z"/><path d="M15 9a4 4 0 0 1 0 6M17.8 6.3a7.8 7.8 0 0 1 0 11.4"/></symbol></defs>
