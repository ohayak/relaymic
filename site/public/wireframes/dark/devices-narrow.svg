<text x="96" y="66" font-size="28" font-weight="600" class="rvw-t">Microphone</text>
<rect x="40" y="94" width="640" height="116" rx="18" class="rvw-cd rvw-l"/>
<text x="64" y="128" font-size="19" font-weight="600" class="rvw-tm">On your device</text>
<text x="64" y="162" font-size="24" font-weight="600" class="rvw-t">Your microphone</text>
<text x="64" y="192" font-size="20" class="rvw-tm">Echo and noise handled here, not on the Mac</text>
<path d="M360 218V250" class="rvw-la"/>
