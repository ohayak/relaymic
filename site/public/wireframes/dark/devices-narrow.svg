<rect x="40" y="1198" width="640" height="116" rx="18" class="rvw-cd rvw-l"/>
<text x="64" y="1232" font-size="19" font-weight="600" class="rvw-tm">On your device</text>
<text x="64" y="1266" font-size="24" font-weight="600" class="rvw-t">Your camera</text>
<text x="64" y="1296" font-size="20" class="rvw-tm">Any camera on it, on or off at any time</text>
<path d="M360 1322V1354" class="rvw-la"/>
<path d="M352.1 1341.3L360 1354L367.9 1341.3" class="rvw-la"/>
<rect x="40" y="1362" width="640" height="116" rx="18" class="rvw-pn rvw-l"/>
<text x="64" y="1396" font-size="19" font-weight="600" class="rvw-ta">On the remote Mac</text>
<text x="64" y="1430" font-size="24" font-weight="600" class="rvw-t">Remote Visio Camera</text>
<text x="64" y="1460" font-size="20" class="rvw-tm">Video apps too, with the optional virtual camera</text>
<path d="M360 1486V1518" class="rvw-la"/>
<path d="M352.1 1505.3L360 1518L367.9 1505.3" class="rvw-la"/>
<rect x="40" y="1526" width="640" height="116" rx="18" class="rvw-cd rvw-l"/>
<text x="64" y="1560" font-size="19" font-weight="600" class="rvw-tm">In the web meeting</text>
<text x="64" y="1594" font-size="24" font-weight="600" class="rvw-t">The meeting sees you</text>
<text x="64" y="1624" font-size="20" class="rvw-tm">Picked like any webcam</text>
<text x="40" y="1692" font-size="21" class="rvw-tm">Remote Visio Microphone and Speaker exist in</text>
<text x="40" y="1722" font-size="21" class="rvw-tm">web pages of Chromium browsers (Chrome, Edge,</text>
<text x="40" y="1752" font-size="21" class="rvw-tm">Brave, Arc…). The Zoom, Teams and FaceTime apps</text>
<text x="40" y="1782" font-size="21" class="rvw-tm">don't see them: join from the browser instead.</text>
