<text x="64" y="326" font-size="24" font-weight="600" class="rvw-t">Remote Visio Microphone</text>
<text x="64" y="356" font-size="20" class="rvw-tm">Your voice, passed on untouched</text>
<path d="M360 382V414" class="rvw-la"/>
