<text x="64" y="520" font-size="20" class="rvw-tm">Picked like any microphone</text>
<use href="#rvdvnd-spk" x="40" y="586" width="40" height="40" class="rvw-i" stroke-width="1.7"/>
<text x="96" y="618" font-size="28" font-weight="600" class="rvw-t">Speaker</text>
<rect x="40" y="646" width="640" height="116" rx="18" class="rvw-cd rvw-l"/>
<text x="64" y="680" font-size="19" font-weight="600" class="rvw-tm">In the web meeting</text>
<text x="64" y="714" font-size="24" font-weight="600" class="rvw-t">The meeting's sound</text>
<text x="64" y="744" font-size="20" class="rvw-tm">Played into Remote Visio Speaker</text>
<path d="M360 770V802" class="rvw-la"/>
<path d="M352.1 789.3L360 802L367.9 789.3" class="rvw-la"/>
<rect x="40" y="810" width="640" height="116" rx="18" class="rvw-pn rvw-l"/>
<text x="64" y="844" font-size="19" font-weight="600" class="rvw-ta">On the remote Mac</text>
<text x="64" y="878" font-size="24" font-weight="600" class="rvw-t">Remote Visio Speaker</text>
<text x="64" y="908" font-size="20" class="rvw-tm">Carries it back; the Mac stays silent</text>
<path d="M360 934V966" class="rvw-la"/>
<path d="M352.1 953.3L360 966L367.9 953.3" class="rvw-la"/>
<rect x="40" y="974" width="640" height="116" rx="18" class="rvw-cd rvw-l"/>
<text x="64" y="1008" font-size="19" font-weight="600" class="rvw-tm">On your device</text>
<text x="64" y="1042" font-size="24" font-weight="600" class="rvw-t">You hear the meeting</text>
<text x="64" y="1072" font-size="20" class="rvw-tm">On your speakers or headphones</text>
<use href="#rvdvnd-cam" x="40" y="1138" width="40" height="40" class="rvw-i" stroke-width="1.7"/>
