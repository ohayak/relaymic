<text x="800" y="786" font-size="20" text-anchor="middle" class="rvw-tm">Remote Visio Microphone and Speaker exist in web pages of Chromium browsers (Chrome, Edge, Brave, Arc…).</text>
<text x="800" y="814" font-size="20" text-anchor="middle" class="rvw-tm">The Zoom, Teams and FaceTime apps don't see them: join those meetings from the browser.</text>
</svg>
