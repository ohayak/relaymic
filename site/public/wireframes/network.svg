.rvw-ia{stroke:var(--rvw-accent)}
.rvw-im{stroke:var(--rvw-muted)}
.rvw-bg{fill:var(--rvw-bg)}
.rvw-pn{fill:var(--rvw-panel)}
.rvw-cd{fill:var(--rvw-card)}
.rvw-sf{fill:var(--rvw-soft)}
.rvw-ik{fill:var(--rvw-ink)}
.rvw-lv{fill:var(--rvw-live)}
.rvw-t{fill:var(--rvw-ink)}
.rvw-tm{fill:var(--rvw-muted)}
.rvw-ta{fill:var(--rvw-accent)}
.rvw-tc{fill:var(--rvw-card)}
.rvw-mono{font-family:var(--rvw-mono,ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace)}
</style>
