<text x="40" y="266" font-size="22" font-weight="600" class="rvw-t">Keep the room quiet</text>
<text x="40" y="292" font-size="19" class="rvw-tm">Controls mutes this Mac's own</text>
<text x="40" y="316" font-size="19" class="rvw-tm">speakers and microphone</text>
