<text x="112" y="86" font-size="24" font-weight="600" class="rvw-t">Install the app</text>
<text x="112" y="112" font-size="16" class="rvw-t rvw-mono">RemoteVisio-2.0-arm64.pkg</text>
<text x="112" y="136" font-size="19" class="rvw-tm">It starts in the menu bar</text>
