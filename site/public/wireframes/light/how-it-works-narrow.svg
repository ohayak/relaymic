<svg xmlns="http://www.w3.org/2000/svg" class="rvw" viewBox="0 0 720 1706" width="720" height="1706" role="img" aria-labelledby="rvhwnl-title rvhwnl-desc">
<title id="rvhwnl-title">How Remote Visio works</title>
<desc id="rvhwnl-desc">1. In front of you, the sender page at https://your-mac:7420 runs in any browser on a phone, laptop or tablet. 2. Your voice and camera go to the remote Mac over one encrypted, peer-to-peer WebRTC connection, and the meeting's sound comes back the same way. On the Mac, the Remote Visio menu-bar app receives them and passes them on, untouched, over the Mac's own address 127.0.0.1. 3. The Remote Visio extension in Chrome, Edge, Brave, Arc or another Chromium browser adds three devices to web pages. 4. The web meeting picks Remote Visio Camera, Remote Visio Microphone and Remote Visio Speaker like any other. The screen, keyboard and mouse stay with your remote desktop tool, as before.</desc>
