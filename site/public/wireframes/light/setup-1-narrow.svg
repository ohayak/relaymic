<svg xmlns="http://www.w3.org/2000/svg" class="rvw" viewBox="0 0 480 1010" width="480" height="1010" role="img" aria-labelledby="rvs1nl-title rvs1nl-desc">
<title id="rvs1nl-title">Install the Remote Visio app</title>
<desc id="rvs1nl-desc">Open RemoteVisio-2.0-arm64.pkg to install the app; it starts in the Mac's menu bar. Its menu shows: Remote Visio receiver: running; Endpoint, click to copy, with the Mac's addresses, such as https://192.168.1.23:7420 and https://100.101.102.103:7420, to open on your phone or laptop; Controls; Start at Login; Install Browser Extension…, which opens the Chrome Web Store; Uninstall Remote Visio…; and Quit Remote Visio.</desc>
<style>
:where(svg.rvw){--rvw-bg:#f6f5f2;--rvw-panel:#ecebe6;--rvw-card:#ffffff;--rvw-ink:#131417;--rvw-muted:#55575e;--rvw-faint:#85878e;--rvw-accent:#9a5700;--rvw-soft:#ffe7b3;--rvw-live:#1b7f45;font-family:var(--rvw-font,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif)}
.rvw-l,.rvw-l2,.rvw-lm,.rvw-la,.rvw-a3,.rvw-ds,.rvw-dt,.rvw-sep,.rvw-bar,.rvw-i,.rvw-ia,.rvw-im{fill:none;stroke-linecap:round;stroke-linejoin:round}
.rvw-l{stroke:var(--rvw-ink);stroke-width:3}
.rvw-l2{stroke:var(--rvw-ink);stroke-width:2}
.rvw-lm{stroke:var(--rvw-muted);stroke-width:2}
.rvw-la{stroke:var(--rvw-accent);stroke-width:4}
.rvw-a3{stroke:var(--rvw-accent);stroke-width:3}
.rvw-ds{stroke:var(--rvw-muted);stroke-width:2.5;stroke-dasharray:10 9}
.rvw-dt{stroke:var(--rvw-muted);stroke-width:3;stroke-dasharray:.5 9}
.rvw-sep{stroke:var(--rvw-faint);stroke-width:1.5}
.rvw-bar{stroke:var(--rvw-faint);stroke-width:7}
.rvw-i{stroke:var(--rvw-ink)}
.rvw-ia{stroke:var(--rvw-accent)}
.rvw-im{stroke:var(--rvw-muted)}
.rvw-bg{fill:var(--rvw-bg)}
.rvw-pn{fill:var(--rvw-panel)}
.rvw-cd{fill:var(--rvw-card)}
.rvw-sf{fill:var(--rvw-soft)}
.rvw-ik{fill:var(--rvw-ink)}
.rvw-lv{fill:var(--rvw-live)}
.rvw-t{fill:var(--rvw-ink)}
.rvw-tm{fill:var(--rvw-muted)}
.rvw-ta{fill:var(--rvw-accent)}
.rvw-tc{fill:var(--rvw-card)}
.rvw-mono{font-family:var(--rvw-mono,ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace)}
</style>
<defs><symbol id="rvs1nl-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol><symbol id="rvs1nl-chevr" viewBox="0 0 24 24"><path d="M10 7.5l4.5 4.5-4.5 4.5"/></symbol><symbol id="rvs1nl-glyph" viewBox="2 10 92 78"><path d="M7.5 22.5H31l4.4-7.2q1.1-1.8 3.2-1.8h18.8q2.1 0 3.2 1.8l4.4 7.2h23.5q3 0 3 3v56q0 3-3 3h-81q-3 0-3-3v-56q0-3 3-3z"/><path d="M13.5 22.5v-4q0-2 2-2h8q2 0 2 2v4M75 22.5a4 4 0 0 1 8 0"/><rect x="38" y="28.5" width="20" height="30" rx="10"/><path d="M31.75 46.5v3a16.25 16.25 0 0 0 32.5 0v-3M48 65.75V73M37.5 73h21M10 46.5v3M17.5 46.5v3M25 46.5v3M71 46.5v3M78.5 46.5v3M86 46.5v3"/></symbol><symbol id="rvs1nl-pkg" viewBox="0 0 24 24"><path d="M3.5 7.5 12 3l8.5 4.5v9L12 21l-8.5-4.5z"/><path d="M3.5 7.5 12 12l8.5-4.5M12 12v9M7.8 5.3l8.4 4.5"/></symbol><symbol id="rvs1nl-wifi" viewBox="0 0 24 24"><path d="M2.5 9.5a13.5 13.5 0 0 1 19 0M5.8 13a8.8 8.8 0 0 1 12.4 0M9.1 16.5a4.2 4.2 0 0 1 5.8 0M12 19.8v.1"/></symbol></defs>
<rect width="480" height="1010" class="rvw-bg"/>
<use href="#rvs1nl-pkg" x="24" y="24" width="64" height="64" class="rvw-i" stroke-width="1"/>
<text x="104" y="52" font-size="26" font-weight="600" class="rvw-t">Install the app</text>
<text x="104" y="82" font-size="19" class="rvw-t rvw-mono">RemoteVisio-2.0-arm64.pkg</text>
<text x="104" y="112" font-size="21" class="rvw-tm">It starts in the menu bar</text>
<rect x="0" y="140" width="480" height="52" class="rvw-pn"/>
<path d="M0 192H480" class="rvw-sep"/>
<path d="M20 166H52" class="rvw-bar"/>
<path d="M74 166H108" class="rvw-bar"/>
<rect x="230" y="146" width="64" height="40" rx="8" class="rvw-sf"/>
<circle cx="262" cy="166" r="30" class="rvw-a3"/>
<use href="#rvs1nl-glyph" x="241" y="148" width="42" height="36" class="rvw-i" stroke-width="4.6"/>
<use href="#rvs1nl-wifi" x="318" y="153" width="26" height="26" class="rvw-im" stroke-width="1.8"/>
<text x="460" y="174" font-size="21" text-anchor="end" class="rvw-tm">9:41</text>
<rect x="20" y="200" width="440" height="470" rx="12" class="rvw-cd rvw-l2"/>
<text x="52" y="240" font-size="21" class="rvw-tm">Remote Visio receiver: running</text>
<path d="M34 262H446" class="rvw-sep"/>
<text x="52" y="298" font-size="21" class="rvw-tm">Endpoint — click to copy:</text>
<rect x="30" y="314" width="6" height="86" rx="3" class="rvw-sf"/>
<path d="M33 316V398" class="rvw-a3"/>
<text x="52" y="344" font-size="20" class="rvw-t rvw-mono">https://192.168.1.23:7420</text>
<text x="52" y="386" font-size="20" class="rvw-t rvw-mono">https://100.101.102.103:7420</text>
<path d="M34 412H446" class="rvw-sep"/>
<text x="52" y="448" font-size="22" class="rvw-t">Controls</text>
<use href="#rvs1nl-chevr" x="420" y="428" width="28" height="28" class="rvw-i" stroke-width="1.9"/>
<use href="#rvs1nl-check" x="26" y="470" width="22" height="22" class="rvw-i" stroke-width="2.4"/>
<text x="52" y="490" font-size="22" class="rvw-t">Start at Login</text>
<path d="M34 510H446" class="rvw-sep"/>
<rect x="28" y="518" width="424" height="44" rx="8" class="rvw-sf rvw-a3"/>
<text x="52" y="548" font-size="22" font-weight="600" class="rvw-t">Install Browser Extension…</text>
<text x="52" y="600" font-size="22" class="rvw-t">Uninstall Remote Visio…</text>
<text x="52" y="644" font-size="22" class="rvw-t">Quit Remote Visio</text>
<text x="444" y="644" font-size="20" text-anchor="end" class="rvw-tm">⌘Q</text>
<circle cx="30" cy="716" r="6" class="rvw-a3"/>
<text x="48" y="724" font-size="24" font-weight="600" class="rvw-t">Your Mac's addresses</text>
<text x="48" y="754" font-size="21" class="rvw-tm">Open one on your phone or laptop</text>
<circle cx="30" cy="820" r="6" class="rvw-a3"/>
<text x="48" y="828" font-size="24" font-weight="600" class="rvw-t">Add the browser extension</text>
<text x="48" y="858" font-size="21" class="rvw-tm">It opens the Chrome Web Store</text>
<circle cx="30" cy="924" r="6" class="rvw-a3"/>
<text x="48" y="932" font-size="24" font-weight="600" class="rvw-t">Keep the room quiet</text>
<text x="48" y="962" font-size="21" class="rvw-tm">Controls mutes this Mac's own</text>
<text x="48" y="990" font-size="21" class="rvw-tm">speakers and microphone</text>
</svg>
